,1fr));gap:18px}.cat{position:relative;min-height:220px;text-align:left;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:var(--grad);box-shadow:0 18px 55px #0008;color:#fff;padding:22px}.cat:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 22%,rgba(255,255,255,.32),transparent 18%),linear-gradient(180deg,transparent,rgba(0,0,0,.70))}.cat:after{content:attr(data-ico);position:absolute;right:20px;top:12px;font-size:90px;filter:drop-shadow(0 16px 24px #0008)}.cat>*{position:relative;z-index:1}.cat div{position:absolute;left:22px;right:22px;bottom:18px}.cat h2{margin:0;font-size:1.9rem;text-transform:uppercase;line-height:1}.cat p{margin:.35rem 0 0;color:#dbeafe;font-weight:850}.page{min-height:100vh;padding:24px;background:linear-gradient(135deg,#030712,#07111f 60%,#020617)}.bar{position:sticky;top:0;z-index:9;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;padding:8px;border-radius:999px;background:rgba(3,7,18,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.10)}.cat-hero{position:relative;overflow:hidden;border-radius:32px;padding:28px;margin-bottom:18px;background:var(--grad);box-shadow:0 22px 70px #0008;border:1px solid rgba(255,255,255,.14)}.cat-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 20%,rgba(255,255,255,.26),transparent 18%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.44))}.cat-hero>*{position:relative}.cat-title{font-size:clamp(2.2rem,6vw,4.4rem);line-height:.92;margin:0;text-transform:uppercase}.cat-desc,.kicker{font-weight:850;color:#e5e7eb}.recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.recipe-card{border-radius:24px;min-height:130px;text-align:left;padding:18px;position:relative;box-shadow:0 14px 38px #0006}.recipe-card:hover,.cat:hover{transform:translateY(-3px);transition:.16s}.recipe-card:after{content:"→";position:absolute;right:18px;bottom:14px;font-size:26px;color:#38bdf8}.recipe-card strong{display:block;font-size:1.13rem;line-height:1.15;color:#fff}.recipe-card span{display:block;margin-top:8px;color:#38bdf8;font-weight:900}.recipes{display:grid;gap:18px}.recipe{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.10)!important;color:#fff!important;border-radius:26px!important;padding:22px!important;margin:0!important;box-shadow:0 16px 45px #0006;scroll-margin-top:16px}.recipe .recipe-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.recipe .badge{display:inline-flex!important;align-items:center;gap:8px;width:auto!important;height:auto!important;border-radius:999px!important;padding:6px 12px!important;background:#0e8f8f!important;color:white!important;font-size:.85rem!important;box-shadow:none!important}.recipe .back{display:none!important}.recipe h3{font-size:1.7rem;margin:.8rem 0 .1rem}.recipe .meta{color:#cbd5e1;font-weight:850}.recipe button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 11px;font-weight:900}.recipe .dose-btn.active{background:#38bdf8!important;color:#06111f!important}.recipe .fav-on,.fav-on{background:#e11d48!important;border-color:#fb7185!important}.recipe .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.recipe .cols section{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px}.recipe h4{color:#38bdf8}.recipe .tip{background:rgba(250,204,21,.10)!important;border-left:5px solid #facc15!important;border-radius:12px;padding:10px 12px}.loading{margin:20vh auto;text-align:center;color:#cbd5e1;font-weight:1000}@media(max-width:900px){.cat-grid,.recipe-grid{grid-template-columns:repeat(2,1fr)}.head{display:block}.search{margin-top:16px}}@media(max-width:640px){.home,.page{padding:14px}.top{align-items:flex-start}.nav{width:100%}.cat-grid,.recipe-grid{grid-template-columns:1fr}.recipe .cols{grid-template-columns:1fr}.cat{min-height:19 <script>
(()=>{const catInfo={"Regole base e consigli":["🧭","Guida rapida","Regole pratiche, formule base e trucchi per non fare disastri.","linear-gradient(135deg,#1f2937,#0f172a)"],"Granite classiche":["❄️","Granite","Limone, caffè, menta, cola e i grandi classici da banco bar.","linear-gradient(135deg,#0f766e,#38bdf8)"],"Granite alla frutta":["🍓","Frutta","Frutta vera, colori forti e sapori freschi senza effetto sciroppone.","linear-gradient(135deg,#be123c,#f59e0b)"],"Frozen cocktail":["🍹","Frozen cocktail","Mojito, Spritz, Margarita, Daiquiri e tutto il reparto festa.","linear-gradient(135deg,#7c2d12,#ea580c)"],"Cocktail analcolici":["🍸","Analcolici","Drink belli da vedere, freschi da bere e senza stendere nessuno.","linear-gradient(135deg,#065f46,#84cc16)"],"Frappè":["🧋","Frappè","Frappè veri, più pertinenti e ben distinti dai caffè freddi.","linear-gradient(135deg,#7c2d12,#f59e0b)"],"Milkshake":["🥤","Milkshake","Nutella, Oreo, Kinder, pistacchio e roba poco innocente.","linear-gradient(135deg,#3f1d13,#a855f7)"],"Caffè e bevande fredde":["☕","Caffè freddi","Cappuccini ghiacciati, mocha, tè frozen e bevande fredde serie.","linear-gradient(135deg,#422006,#92400e)"],"Smoothie ghiacciati":["🥭","Smoothie","Frutta, yogurt e bevande un filo più leggere.","linear-gradient(135deg,#14532d,#22c55e)"],"Ricette ignoranti":["😈","Ignoranti","Nutella, Oreo, Red Bull, Kinder: qui il dietologo cambia mestiere.","linear-gradient(135deg,#111827,#dc2626)"],"Amari e digestivi frozen":["🥃","Amari frozen","Amari, sambuca, brandy e digestivi ghiacciati da fine cena.","linear-gradient(135deg,#3f1d13,#b45309)"],"Dessert freddi":["🍨","Dessert","Sorbetti, tiramisù, creme, cacao e dolci freddi al bicchiere.","linear-gradient(135deg,#581c87,#ec4899)"]};let data={},currentCat=null,lastSpecial=null;const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];function show(id){$$('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}function recipeTitle(r){return (r.querySelector('h3')?.textContent||'Ricetta').trim()}function recipeMeta(r){return r.dataset.category||''}function sorted(arr){return arr.slice().sort((a,b)=>recipeTitle(a).localeCompare(recipeTitle(b),'it',{sensitivity:'base'}))}const safeGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};function isFav(r){return safeGet('fav_'+(r.id||recipeTitle(r)))==='1'}function num(n){return Math.abs(n-Math.round(n))<.05?String(Math.round(n)):String(Math.round(n*10)/10).replace('.',',')}function scaleText(txt,scale){txt=String(txt||'');txt=txt.replace(/(\d+(?:[,.]\d+)?)(\s*-\s*)(\d+(?:[,.]\d+)?)/g,(m,a,sep,b)=>num(parseFloat(a.replace(',','.'))*scale)+sep+num(parseFloat(b.replace(',','.'))*scale));return txt.replace(/(^|[^\w])(\d+(?:[,.]\d+)?)(?=\s*(ml|g|kg|l|cl|cucchiai|cucchiaio|cucchiaini|cucchiaino|banane|banana|fragole|oreo|palline|barrette|lime|limoni|limone|kiwi|pezzi|bottiglie)\b)/gi,(m,p,n)=>p+num(parseFloat(n.replace(',','.'))*scale))}function wireRecipe(card){const key='fav_'+(card.id||recipeTitle(card));const favBtn=card.querySelector('.fav-btn');const doseBtns=$$('.dose-btn',card);const doseLabel=card.querySelector('.dose-label');$$('li',card).forEach(li=>{if(!li.getAttribute('data-original'))li.setAttribute('data-original',li.textContent)});if(favBtn){const on=safeGet(key)==='1';card.classList.toggle('isFav',on);favBtn.classList.toggle('fav-on',on);favBtn.textContent=on?'❤️ Preferito':'♡ Preferito';favBtn.onclick=function(){const now=!card.classList.contains('isFav');card.classList.toggle('isFav',now);favBtn.classList.toggle('fav-on',now);favBtn.textContent=now?'❤️ Preferito':'♡ Preferito';safeSet(key,now?'1':'0');updateFavButton()}}
 doseBtns.forEach(btn=>{btn.onclick=function(){const scale=parseFloat(btn.getAttribute('data-scale'));$$('li',card).forEach(li=>{const original=li.getAttribute('data-original')||li.textContent;li.textContent=scaleText(original,scale)});doseBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(doseLabel)doseLabel.textContent='Dose ×'+String(scale).replace('.',',')}});
}
function recipeTechInfo(cat,title){let c=(cat||'').toLowerCase(),t=(title||'').toLowerCase();let info={prep:'5 min',machine:'25/35 min',serv:'2 bicchieri',fn:'Slush',diff:'Facile'};if(c.includes('granite')){info={prep:'5 min',machine:'25/35 min',serv:'2/3 bicchieri',fn:'Slush',diff:'Facile'};if(/caff|cola|chinotto|tamarindo|orzata|mandorla/.test(t))info.machine='30/40 min';if(/limone|lime|menta|cedrata|gassosa|pompelmo|arancia/.test(t))info.machine='20/30 min';if(/banana|cacao|mango|pesca|melone|albicocca|pera|kiwi|fichi|frutti|fragola|lampone|ciliegia|melagrana|uva/.test(t))info.machine='30/45 min';if(/cocco|latte/.test(t)){info.machine='35/50 min';info.fn='Slush / Frozen Drink'}}else if(c.includes('frozen cocktail')){info={prep:'5/8 min',machine:'25/35 min',serv:'2 bicchieri',fn:'Spiked Slush',diff:'Facile'};if(/mojito|spritz|bellini|rossini|hugo|paloma|limoncello|campari|americano/.test(t))info.machine='20/30 min';if(/margarita|daiquiri|moscow|gin|vodka|cuba|negroni/.test(t))info.machine='25/35 min';if(/pina|colada|mai tai|rum punch|pornstar|sex on the beach|sangria|long island/.test(t))info.machine='30/45 min';if(/espresso/.test(t))info.machine='30/40 min'}else if(c.includes('cocktail analcolici')){info={prep:'5 min',machine:'20/30 min',serv:'2 bicchieri',fn:'Slush / Frozen Drink',diff:'Facile'};if(/cocco|ananas|tropical|pesca|mela|cranberry|shirley/.test(t))info.machine='25/35 min';if(/ginger|lime|menta|limonata|cetriolo|arancia/.test(t))info.machine='18/28 min'}else if(c.includes('frapp')){info={prep:'5 min',machine:'15/25 min',serv:'2 bicchieri',fn:'Milkshake',diff:'Facile'};if(/caffe|caffè|vaniglia|fragola|banana/.test(t))info.machine='15/20 min';if(/cioccolato|nutella|nocciola|caramello|stracciatella/.test(t))info.machine='20/30 min';if(/yogurt|miele|cocco|ananas|mango/.test(t))info.machine='18/28 min'}else if(c.includes('milkshake')){info={prep:'5 min',machine:'15/25 min',serv:'2 bicchieri',fn:'Milkshake',diff:'Facile'};if(/vaniglia|fragola|banana/.test(t))info.machine='15/20 min';if(/nutella|oreo|cioccolato|kinder|snickers|mars|ferrero|pistacchio|burro|mou/.test(t))info.machine='22/32 min';if(/tiramisu|cheesecake|raffaello|bounty/.test(t))info.machine='20/30 min'}else if(c.includes('caff')){info={prep:'5 min',machine:'18/30 min',serv:'2 bicchieri',fn:'Frozen Drink / Slush',diff:'Facile'};if(/shakerato|cold brew|tonic|te|tè/.test(t))info.machine='15/25 min';if(/cappuccino|latte|macchiato|mocha|caramel|nocciola|mandorla|affogato/.test(t))info.machine='22/35 min'}else if(c.includes('smoothie')){info={prep:'5/7 min',machine:'20/35 min',serv:'2 bicchieri',fn:'Frozen Drink',diff:'Facile'};if(/banana|mango|pesca|avocado|cocco/.test(t))info.machine='25/40 min';if(/fragola|frutti|mela|kiwi|ananas|lampone/.test(t))info.machine='20/30 min'}else if(c.includes('dessert')){info={prep:'8/10 min',machine:'25/40 min',serv:'2 porzioni',fn:'Milkshake / Frozen Drink',diff:'Facile'};if(/tiramis|crema|panna|mascarpone|ricotta|cheesecake/.test(t))info.machine='30/45 min';if(/limone|sorbetto|cacao|cocco/.test(t))info.machine='22/35 min'}else if(c.includes('amari')){info={prep:'5 min',machine:'20/35 min',serv:'2 bicchieri piccoli',fn:'Spiked Slush',diff:'Facile'};if(/crema|caffe|caffè|sambuca/.test(t))info.machine='25/40 min'}else if(c.includes('ignoranti')){info={prep:'5/8 min',machine:'25/40 min',serv:'2 bicchieri',fn:'Milkshake / Frozen Drink',diff:'Facile'};if(/red bull|cola|energy/.test(t))info.machine='18/28 min';if(/nutella|oreo|kinder|cioccolato|burro/.test(t))info.machine='25/40 min'}return info}function insertRecipeTech(card){if(card.querySelector('.recipe-tech'))return;let cat=card.dataset.category||'';let title=(card.querySelector('h3')?.textContent||card.id||'');let info=recipeTechInfo(cat,title);let box=document.createElement('div');box.className='recipe-tech';box.innerHTML=`<div class="recipe-tech-title">Scheda rapida</div><div class="recipe-tech-grid"><div class="recipe-tech-item">⏱️<div><b>Preparazione</b><span>${info.prep}</span></div></div><div class="recipe-tech-item">🧊<div><b>Tempo in macchina</b><span>${info.machine}</span></div></div><div class="recipe-tech-item">🥤<div><b>Porzioni</b><span>${info.serv}</span></div></div><div class="recipe-tech-item">⚙️<div><b>Funzione consigliata</b><span>${info.fn}</span></div></div><div class="recipe-tech-item">📌<div><b>Difficoltà</b><span>${info.diff}</span></div></div></div>`;let target=card.querySelector('.recipe-photo-wrap')||card.querySelector('.meta')||card.querySelector('h3');if(target)target.insertAdjacentElement('afterend',box);else card.prepend(box)}function cleanRecipe(el){let c=el.cloneNode(true);c.querySelectorAll('.back').forEach(x=>x.remove());insertRecipeTech(c);wireRecipe(c);return c}
function home(){lastSpecial=null;show('#homeView');updateFavButton()}
function updateFavButton(){const b=$('#favBtn');if(!b)return;const n=Object.values(data).flat().filter(isFav).length;b.textContent=n?'❤️ Preferiti '+n:'♡ Preferiti';b.classList.toggle('fav-on',n>0)}
function cardThumb(r,emoji){let src=(r.dataset.image||'').trim();if(!src){let im=r.querySelector('img.recipe-photo');src=im?im.getAttribute('src'):''}return src?`<img class="card-thumb" src="${src}" alt="" loading="lazy" onerror="this.style.display='none'">`:`<div class="card-thumb ph">${emoji}</div>`}function openCategory(cat){lastSpecial=null;currentCat=cat;const info=catInfo[cat]||['🥷',cat,'Ricette della categoria.','linear-gradient(135deg,#111827,#7c3aed)'];const arr=sorted(data[cat]||[]);$('#catHero').innerHTML=`<div class="cat-hero" style="--grad:${info[3]}"><p class="kicker">${info[0]} Categoria</p><h1 class="cat-title">${cat}</h1><p class="cat-desc">${info[2]}</p><div class="actions"><button class="btn" onclick="window.slushiHome()">🏠 Torna alla home</button></div></div>`;$('#recipeGrid').innerHTML=arr.map((r)=>`<button class="recipe-card" data-id="${r.id}">${cardThumb(r,info[0])}<strong>${info[0]} ${recipeTitle(r)}</strong><span>${recipeMeta(r)}</span></button>`).join('');$$('#recipeGrid .recipe-card').forEach(b=>b.onclick=()=>openRecipe(cat,b.dataset.id));show('#catView')}function openRecipe(cat,recipeId){currentCat=cat;lastSpecial=null;const arr=sorted(data[cat]||[]);let idx=Math.max(0,arr.findIndex(r=>r.id===recipeId));const ordered=arr.slice(idx).concat(arr.slice(0,idx));$('#recipeList').innerHTML='';ordered.forEach(r=>$('#recipeList').appendChild(cleanRecipe(r)));show('#recipeView')}function openFromList(list,recipeId,label){lastSpecial={list,label};const idx=Math.max(0,list.findIndex(x=>x.r.id===recipeId));$('#recipeList').innerHTML='';list.slice(idx).concat(list.slice(0,idx)).forEach(x=>$('#recipeList').appendChild(cleanRecipe(x.r)));show('#recipeView')}function openList(title,desc,list,grad){$('#catHero').innerHTML=`<div class="cat-hero" style="--grad:${grad||'linear-gradient(135deg,#111827,#7c3aed)'}"><p class="kicker">📚 Elenco</p><h1 class="cat-title">${title}</h1><p class="cat-desc">${desc}</p><div class="actions"><button class="btn" onclick="window.slushiHome()">🏠 Torna alla home</button></div></div>`;$('#recipeGrid').innerHTML=list.map(x=>`<button class="recipe-card" data-id="${x.r.id}">${cardThumb(x.r,(catInfo[x.cat]?.[0]||'🥷'))}<strong>${(catInfo[x.cat]?.[0]||'🥷')} ${recipeTitle(x.r)}</strong><span>${x.cat}</span></button>`).join('');$$('#recipeGrid .recipe-card').forEach(b=>b.onclick=()=>openFromList(list,b.dataset.id,title));show('#catView')}function allList(){let list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>list.push({cat,r})));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));openList('Tutte A-Z',list.length+' ricette in ordine alfabetico.',list,'linear-gradient(135deg,#111827,#7c3aed)')}function favList(){let list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>{if(isFav(r))list.push({cat,r})}));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));if(!list.length){alert('Ancora nessuna ricetta nei preferiti.');return}openList('Preferiti',list.length+' ricette salvate nei preferiti.',list,'linear-gradient(135deg,#831843,#e11d48)')}function doSearch(){const q=$('#searchInput').value.trim().toLowerCase();if(!q)return;let list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>{const txt=(r.dataset.search||r.textContent||'').toLowerCase();if(txt.includes(q))list.push({cat,r})}));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));openList(q,list.length+' risultati trovati in ordine alfabetico.',list,'linear-gradient(135deg,#111827,#7c3aed)')}$('#allBtn').onclick=allList;$('#favBtn').onclick=favList;$('#searchBtn').onclick=doSearch;$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});$('#homeBtn2').onclick=home;$('#backBtn').onclick=()=>{if(lastSpecial){openList(lastSpecial.label,'Risultati precedenti',lastSpecial.list)}else if(currentCat&&data[currentCat])openCategory(currentCat);else home()};fetch('./ricette-source.html?v='+Date.now()).then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');$$('article.recipe',doc).forEach(r=>{const cat=r.dataset.category||'Altro';(data[cat]||(data[cat]=[])).push(r)});$('#catGrid').innerHTML=Object.keys(catInfo).filter(cat=>data[cat]?.length).map(cat=>{const i=catInfo[cat];return `<button class="cat" data-cat="${cat}" data-ico="${i[0]}" style="--grad:${i[3]}"><div><h2>${i[1]}</h2><p>${data[cat].length} ricette</p><p>${i[2]}</p></div></button>`}).join('');$$('.cat').forEach(c=>c.onclick=()=>openCategory(c.dataset.cat));$('#loading').style.display='none';home()}).catch(err=>{$('#loading').textContent='Errore caricamento ricette: '+err.message})})();
</script>
