ba(0,0,0,.38);border:1px solid rgba(255,255,255,.14)}.cat-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 20%,rgba(255,255,255,.26),transparent 18%),linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.42))}.cat-hero>*{position:relative;z-index:1}.kicker{font-weight:1000;text-transform:uppercase;letter-spacing:.18em;color:#dbeafe;margin:0 0 8px}.cat-title{font-size:clamp(2.3rem,6vw,4.4rem);line-height:.92;margin:0;text-transform:uppercase}.cat-desc{font-weight:800;color:#e5e7eb;max-width:760px;margin:12px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.recipe-card{position:relative;min-height:128px;text-align:left;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;border-radius:24px;padding:18px;cursor:pointer;box-shadow:0 14px 38px rgba(0,0,0,.24);overflow:hidden}.recipe-card:after{content:"→";position:absolute;right:18px;bottom:14px;font-size:26px;color:#38bdf8;font-weight:1000}.recipe-card strong{display:block;font-size:1.15rem;line-height:1.15}.recipe-card span{display:block;color:#cbd5e1;margin-top:8px;font-weight:800;font-size:.9rem}.recipe-wrap{display:grid;gap:18px}.recipe{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.10)!important;box-shadow:0 16px 45px rgba(0,0,0,.28)!important;color:#f8fafc!important;border-radius:26px!important;padding:22px!important;margin:0!important;scroll-margin-top:18px}.recipe .recipe-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.recipe .badge{display:inline-flex;align-items:center;gap:8px;background:#0e8f8f;color:white;border-radius:999px;padding:5px 12px;font-weight:900;font-size:.85rem;width:auto;height:auto;box-shadow:none}.recipe .back{display:none}.recipe h3{font-size:1.7rem;margin:.7rem 0 .1rem}.recipe .meta{color:#cbd5e1;font-weight:800}.recipe button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 11px;font-weight:900;cursor:pointer}.recipe button:hover{background:#a855f7}.recipe .dose-btn.active{background:#38bdf8!important;color:#07111f!important}.recipe .dose-label{color:#cbd5e1;font-weight:1000;display:inline-flex;align-items:center}.recipe .recipe-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.recipe .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.recipe .cols section{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px}.recipe h4{color:#38bdf8}.recipe .tip{background:rgba(250,204,21,.10)!important;border-left:5px solid #facc15!important;color:#fff;border-radius:12px;padding:10px 12px}.topbar{position:sticky;top:0;z-index:10;background:rgba(3,7,18,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:8px;margin:0 0 18px;display:flex;gap:8px;flex-wrap:wrap}.loader{max-width:900px;margin:20vh auto;text-align:center;color:#cbd5e1;font-weight:900}.hidden{display:none!important}@media(max-width:980px){.grid,.recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.headline{display:block}.search{margin-top:16px}}@media(max-width:640px){.bar{align-items:flex-start}.nav{display:flex;width:100%}.grid,.recipe-grid{grid-template-columns:1fr}.cat-card{min-height:190px}.cat-card:after{font-size:82px}.search{flex-direction:column}.recipe .cols{grid-template-columns:1fr}.screen{padding:14px 12px 50px}.cat-hero{padding:22px}.cat-title{font-size:2.25rem}}

<script>
(function(){
const catInfo={
 'Regole base e consigli':['🧭','Guida rapida','Regole pratiche, formule base e trucchi per non fare disastri.','linear-gradient(135deg,#1f2937,#0f172a)'],
 'Granite classiche':['❄️','Granite','Limone, caffè, menta, cola e i grandi classici da banco bar.','linear-gradient(135deg,#0f766e,#38bdf8)'],
 'Granite alla frutta':['🍓','Frutta','Frutta vera, colori forti e sapori freschi senza effetto sciroppone.','linear-gradient(135deg,#be123c,#f59e0b)'],
 'Frozen cocktail':['🍹','Frozen cocktail','Mojito, Spritz, Margarita, Daiquiri e tutto il reparto festa.','linear-gradient(135deg,#7c2d12,#ea580c)'],
 'Cocktail analcolici':['🍸','Analcolici','Drink belli da vedere, freschi da bere e senza stendere nessuno.','linear-gradient(135deg,#065f46,#84cc16)'],
 'Frappè':['🧋','Frappè','Frappè veri, più pertinenti e ben distinti dai caffè freddi.','linear-gradient(135deg,#7c2d12,#f59e0b)'],
 'Milkshake':['🥤','Milkshake','Nutella, Oreo, Kinder, pistacchio e roba poco innocente.','linear-gradient(135deg,#3f1d13,#a855f7)'],
 'Caffè e bevande fredde':['☕','Caffè freddi','Cappuccini ghiacciati, mocha, tè frozen e bevande fredde serie.','linear-gradient(135deg,#422006,#92400e)'],
 'Smoothie ghiacciati':['🥭','Smoothie','Frutta, yogurt e bevande un filo più leggere, senza fare i santi.','linear-gradient(135deg,#14532d,#22c55e)'],
 'Ricette ignoranti':['😈','Ignoranti','Nutella, Oreo, Red Bull, Kinder: qui il dietologo cambia mestiere.','linear-gradient(135deg,#111827,#dc2626)'],
 'Amari e digestivi frozen':['🥃','Amari frozen','Amari, sambuca, brandy e digestivi ghiacciati da fine cena.','linear-gradient(135deg,#3f1d13,#b45309)'],
 'Dessert freddi':['🍨','Dessert','Sorbetti, tiramisù, creme, cacao e dolci freddi al bicchiere.','linear-gradient(135deg,#581c87,#ec4899)']
};
let data={}, currentCat=null, lastSpecial=null;
const $=s=>document.querySelector(s), $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fmtNum(n){if(Math.abs(n-Math.round(n))<.05)return String(Math.round(n));return String(Math.round(n*10)/10).replace('.',',')}
function scaleText(text,scale){text=String(text||'');text=text.replace(/(\d+(?:[,.]\d+)?)(\s*-\s*)(\d+(?:[,.]\d+)?)/g,(m,a,sep,b)=>fmtNum(parseFloat(a.replace(',','.'))*scale)+sep+fmtNum(parseFloat(b.replace(',','.'))*scale));text=text.replace(/(^|[^\w])(\d+(?:[,.]\d+)?)(?=\s*(ml|g|kg|l|cl|cucchiai|cucchiaio|cucchiaini|cucchiaino|banane|banana|fragole|oreo|palline|barrette|lime|limoni|limone|kiwi|pezzi|bottiglie)\b)/gi,(m,p,n)=>p+fmtNum(parseFloat(n.replace(',','.'))*scale));return text}
function show(id){$$('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function recipeTitle(el){return (el.querySelector('h3')?.textContent||'Ricetta').trim()}
function recipeMeta(el){return (el.querySelector('.meta')?.textContent||el.dataset.category||'').trim()}
function sorted(arr){return arr.slice().sort((a,b)=>recipeTitle(a).localeCompare(recipeTitle(b),'it',{sensitivity:'base'}))}
function isFav(el){return safeGet('slushi_fav_'+el.id)==='1'}
function decorateBadge(card){const badge=card.querySelector('.badge'); if(!badge)return; const cat=card.getAttribute('data-category')||''; const info=catInfo[cat]; if(info){badge.textContent=info[0]+' '+cat;}}
function wireRecipe(card){
 const favBtn=card.querySelector('.fav-btn'), doseBtns=$$('.dose-btn',card), doseLabel=card.querySelector('.dose-label'), key='slushi_fav_'+card.id;
 decorateBadge(card);
 if(favBtn){const on=safeGet(key)==='1';card.classList.toggle('isFav',on);favBtn.classList.toggle('fav-on',on);favBtn.textContent=on?'❤️ Preferito':'♡ Preferito';favBtn.onclick=function(){const now=!card.classList.contains('isFav');card.classList.toggle('isFav',now);favBtn.classList.toggle('fav-on',now);favBtn.textContent=now?'❤️ Preferito':'♡ Preferito';safeSet(key,now?'1':'0');updateFavButton()}}
 doseBtns.forEach(btn=>{btn.onclick=function(){const scale=parseFloat(btn.getAttribute('data-scale'));$$('li',card).forEach(li=>{const original=li.getAttribute('data-original')||li.textContent;li.textContent=scaleText(original,scale)});doseBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(doseLabel)doseLabel.textContent='Dose ×'+String(scale).replace('.',',')}});
}
function recipeTechInfo(cat,title){let c=(cat||'').toLowerCase(),t=(title||'').toLowerCase();let info={prep:'3/5 min',machine:'25/35 min',serv:'2 bicchieri',fn:'Slush',diff:'Facile'};if(c.includes('granite')){info={prep:'3/5 min',machine:'25/35 min',serv:'2/3 bicchieri',fn:'Slush',diff:'Facile'};if(/cedrata|gassosa|cola|chinotto|tamarindo|orzata/.test(t))info.prep='1/2 min';else if(/limone|lime|menta|pompelmo|arancia/.test(t))info.prep='3/5 min';else if(/mango|banana|cocco|ananas|cacao|latte/.test(t))info.prep='8/12 min';else if(/anguria|melone|pesca|albicocca|pera|kiwi|fragola|lampone|ciliegia|melagrana|uva|fichi|frutti/.test(t))info.prep='6/10 min';else if(/caff|mandorla/.test(t))info.prep='3/6 min';if(/caff|cola|chinotto|tamarindo|orzata|mandorla/.test(t))info.machine='30/40 min';if(/limone|lime|menta|cedrata|gassosa|pompelmo|arancia/.test(t))info.machine='20/30 min';if(/banana|cacao|mango|pesca|melone|albicocca|pera|kiwi|fichi|frutti|fragola|lampone|ciliegia|melagrana|uva/.test(t))info.machine='30/45 min';if(/cocco|latte/.test(t)){info.machine='35/50 min';info.fn='Slush / Frozen Drink'}}else if(c.includes('frozen cocktail')){info={prep:'4/7 min',machine:'25/35 min',serv:'2 bicchieri',fn:'Spiked Slush',diff:'Facile'};if(/spritz|bellini|rossini|hugo|vodka lemon|gin lemon|campari|americano|limoncello/.test(t))info.prep='3/5 min';else if(/pina|colada|mai tai|rum punch|pornstar|sex on the beach|sangria|long island|espresso/.test(t))info.prep='7/10 min';else if(/mojito|margarita|daiquiri|paloma|moscow|caipiroska|negroni|cuba/.test(t))info.prep='5/8 min';if(/mojito|spritz|bellini|rossini|hugo|paloma|limoncello|campari|americano/.test(t))info.machine='20/30 min';if(/margarita|daiquiri|moscow|gin|vodka|cuba|negroni/.test(t))info.machine='25/35 min';if(/pina|colada|mai tai|rum punch|pornstar|sex on the beach|sangria|long island/.test(t))info.machine='30/45 min';if(/espresso/.test(t))info.machine='30/40 min'}else if(c.includes('cocktail analcolici')){info={prep:'3/5 min',machine:'20/30 min',serv:'2 bicchieri',fn:'Slush / Frozen Drink',diff:'Facile'};if(/ananas|cocco|tropical|pesca|mela|cranberry|shirley/.test(t))info.prep='5/8 min';else if(/limonata|ginger|lime|menta|cetriolo|arancia|spritz|mojito/.test(t))info.prep='3/5 min';if(/cocco|ananas|tropical|pesca|mela|cranberry|shirley/.test(t))info.machine='25/35 min';if(/ginger|lime|menta|limonata|cetriolo|arancia/.test(t))info.machine='18/28 min'}else if(c.includes('frapp')){info={prep:'3/5 min',machine:'15/25 min',serv:'2 bicchieri',fn:'Milkshake',diff:'Facile'};if(/caffe|caffè|vaniglia/.test(t))info.prep='2/4 min';else if(/fragola|banana|mango|cocco|ananas/.test(t))info.prep='5/8 min';else if(/cioccolato|nutella|nocciola|caramello|stracciatella|yogurt|miele/.test(t))info.prep='4/7 min';if(/caffe|caffè|vaniglia|fragola|banana/.test(t))info.machine='15/20 min';if(/cioccolato|nutella|nocciola|caramello|stracciatella/.test(t))info.machine='20/30 min';if(/yogurt|miele|cocco|ananas|mango/.test(t))info.machine='18/28 min'}else if(c.includes('milkshake')){info={prep:'3/5 min',machine:'15/25 min',serv:'2 bicchieri',fn:'Milkshake',diff:'Facile'};if(/vaniglia/.test(t))info.prep='2/3 min';else if(/nutella|oreo|cioccolato|kinder|snickers|mars|ferrero|pistacchio|burro|mou|tiramisu|cheesecake|raffaello|bounty/.test(t))info.prep='6/10 min';else if(/fragola|banana/.test(t))info.prep='4/7 min';if(/vaniglia|fragola|banana/.test(t))info.machine='15/20 min';if(/nutella|oreo|cioccolato|kinder|snickers|mars|ferrero|pistacchio|burro|mou/.test(t))info.machine='22/32 min';if(/tiramisu|cheesecake|raffaello|bounty/.test(t))info.machine='20/30 min'}else if(c.includes('caff')){info={prep:'2/5 min',machine:'18/30 min',serv:'2 bicchieri',fn:'Frozen Drink / Slush',diff:'Facile'};if(/shakerato|cold brew|tonic|te|tè/.test(t))info.prep='2/4 min';else if(/cappuccino|latte|macchiato|mocha|caramel|nocciola|mandorla|affogato/.test(t))info.prep='4/7 min';if(/shakerato|cold brew|tonic|te|tè/.test(t))info.machine='15/25 min';if(/cappuccino|latte|macchiato|mocha|caramel|nocciola|mandorla|affogato/.test(t))info.machine='22/35 min'}else if(c.includes('smoothie')){info={prep:'6/10 min',machine:'20/35 min',serv:'2 bicchieri',fn:'Frozen Drink',diff:'Facile'};if(/banana|mango|pesca|avocado|cocco/.test(t))info.prep='8/12 min';if(/banana|mango|pesca|avocado|cocco/.test(t))info.machine='25/40 min';if(/fragola|frutti|mela|kiwi|ananas|lampone/.test(t))info.machine='20/30 min'}else if(c.includes('dessert')){info={prep:'8/12 min',machine:'25/40 min',serv:'2 porzioni',fn:'Milkshake / Frozen Drink',diff:'Facile'};if(/tiramis|crema|panna|mascarpone|ricotta|cheesecake/.test(t))info.prep='10/15 min';else if(/limone|sorbetto|cacao|cocco/.test(t))info.prep='6/10 min';if(/tiramis|crema|panna|mascarpone|ricotta|cheesecake/.test(t))info.machine='30/45 min';if(/limone|sorbetto|cacao|cocco/.test(t))info.machine='22/35 min'}else if(c.includes('amari')){info={prep:'2/5 min',machine:'20/35 min',serv:'2 bicchieri piccoli',fn:'Spiked Slush',diff:'Facile'};if(/crema|caffe|caffè|sambuca/.test(t)){info.prep='4/7 min';info.machine='25/40 min'}}else if(c.includes('ignoranti')){info={prep:'6/10 min',machine:'25/40 min',serv:'2 bicchieri',fn:'Milkshake / Frozen Drink',diff:'Facile'};if(/red bull|cola|energy/.test(t)){info.prep='2/4 min';info.machine='18/28 min'}if(/nutella|oreo|kinder|cioccolato|burro/.test(t)){info.prep='6/10 min';info.machine='25/40 min'}}return info}function insertRecipeTech(card){if(card.querySelector('.recipe-tech'))return;let cat=card.dataset.category||'';let title=(card.querySelector('h3')?.textContent||card.id||'');let info=recipeTechInfo(cat,title);let box=document.createElement('div');box.className='recipe-tech';box.innerHTML=`<div class="recipe-tech-title">Scheda rapida</div><div class="recipe-tech-grid"><div class="recipe-tech-item">⏱️<div><b>Preparazione</b><span>${info.prep}</span></div></div><div class="recipe-tech-item">🧊<div><b>Tempo in macchina</b><span>${info.machine}</span></div></div><div class="recipe-tech-item">⚙️<div><b>Funzione consigliata</b><span>${info.fn}</span></div></div><div class="recipe-tech-item">📌<div><b>Difficoltà</b><span>${info.diff}</span></div></div>`;let target=card.querySelector('.recipe-photo-wrap')||card.querySelector('.meta')||card.querySelector('h3');if(target)target.insertAdjacentElement('afterend',box);else card.prepend(box)}function cleanRecipe(el){let c=el.cloneNode(true);c.querySelectorAll('.back').forEach(x=>x.remove());insertRecipeTech(c);wireRecipe(c);return c}
function home(){lastSpecial=null;show('#homeView');updateFavButton()}
function updateFavButton(){const b=$('#favBtn');if(!b)return;const n=Object.values(data).flat().filter(isFav).length;b.textContent=n?'❤️ Preferiti '+n:'♡ Preferiti';b.classList.toggle('fav-on',n>0)}
function cardThumb(r,emoji){let src=(r.dataset.image||'').trim();if(!src){let im=r.querySelector('img.recipe-photo');src=im?im.getAttribute('src'):''}return src?`<img class="card-thumb" src="${src}" alt="" loading="lazy" onerror="this.style.display='none'">`:`<div class="card-thumb ph">${emoji}</div>`}function openCategory(cat){lastSpecial=null;currentCat=cat;const info=catInfo[cat]||['🥷',cat,'Ricette della categoria.','linear-gradient(135deg,#111827,#7c3aed)'];const arr=sorted(data[cat]||[]);$('#catHero').innerHTML=`<div class="cat-hero" style="--grad:${info[3]}"><p class="kicker">${info[0]} Categoria</p><h1 class="cat-title">${cat}</h1><p class="cat-desc">${info[2]}</p><div class="actions"><button class="btn" onclick="window.slushiHome()">🏠 Torna alla home</button></div></div>`;$('#recipeGrid').innerHTML=arr.map((r)=>`<button class="recipe-card" data-id="${r.id}">${cardThumb(r,info[0])}<strong>${info[0]} ${recipeTitle(r)}</strong><span>${recipeMeta(r)}</span></button>`).join('');$$('#recipeGrid .recipe-card').forEach(b=>b.onclick=()=>openRecipe(cat,b.dataset.id));show('#catView')}
function openRecipe(cat,recipeId){currentCat=cat;const arr=sorted(data[cat]||[]);let idx=Math.max(0,arr.findIndex(r=>r.id===recipeId));const ordered=arr.slice(idx).concat(arr.slice(0,idx));$('#recipeList').innerHTML='';ordered.forEach(r=>$('#recipeList').appendChild(cleanRecipe(r)));show('#recipeView')}
function openRecipeFromList(list,recipeId,backLabel){lastSpecial=list;currentCat=backLabel;let idx=Math.max(0,list.findIndex(x=>x.r.id===recipeId));let ordered=list.slice(idx).concat(list.slice(0,idx));$('#recipeList').innerHTML='';ordered.forEach(x=>$('#recipeList').appendChild(cleanRecipe(x.r)));show('#recipeView')}
function openList(title,desc,list,grad){$('#catHero').innerHTML=`<div class="cat-hero" style="--grad:${grad||'linear-gradient(135deg,#111827,#7c3aed)'}"><p class="kicker">📚 Elenco</p><h1 class="cat-title">${title}</h1><p class="cat-desc">${desc}</p><div class="actions"><button class="btn" onclick="window.slushiHome()">🏠 Torna alla home</button></div></div>`;$('#recipeGrid').innerHTML=list.map(x=>`<button class="recipe-card" data-id="${x.r.id}">${cardThumb(x.r,(catInfo[x.cat]?.[0]||'🥷'))}<strong>${(catInfo[x.cat]?.[0]||'🥷')} ${recipeTitle(x.r)}</strong><span>${x.cat}</span></button>`).join('');$$('#recipeGrid .recipe-card').forEach(b=>b.onclick=()=>openRecipeFromList(list,b.dataset.id,title));show('#catView')}
function allList(){lastSpecial='all';const list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>list.push({cat,r})));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));openList('Tutte A-Z',list.length+' ricette in ordine alfabetico.',list,'linear-gradient(135deg,#111827,#7c3aed)')}
function favList(){const list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>{if(isFav(r))list.push({cat,r})}));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));if(!list.length){alert('Ancora nessuna ricetta nei preferiti. Apri una ricetta e premi ♡ Preferito.');return}lastSpecial='fav';openList('Preferiti',list.length+' ricette salvate nei preferiti.',list,'linear-gradient(135deg,#831843,#e11d48)')}
function search(){const q=$('#searchBox').value.trim().toLowerCase();if(!q)return;let list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>{const t=(r.getAttribute('data-search')||r.textContent||'').toLowerCase();if(t.includes(q))list.push({cat,r})}));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));lastSpecial='search';openList(q,list.length+' risultati trovati in ordine alfabetico.',list,'linear-gradient(135deg,#111827,#7c3aed)')}
window.slushiHome=home;
$('#catHomeBtn').onclick=home;$('#recipeHomeBtn').onclick=home;$('#backCatBtn').onclick=()=>{if(lastSpecial==='all')allList();else if(lastSpecial==='fav')favList();else if(lastSpecial==='search')search();else if(currentCat&&data[currentCat])openCategory(currentCat);else home()};$('#allBtn').onclick=allList;$('#favBtn').onclick=favList;$('#searchBtn').onclick=search;$('#searchBox').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
fetch('./ricette-source.html?source='+Date.now()).then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');const recipes=Array.from(doc.querySelectorAll('article.recipe'));recipes.forEach(r=>{const cat=r.getAttribute('data-category')||'Altro';if(!data[cat])data[cat]=[];data[cat].push(r)});$('#catGrid').innerHTML=Object.keys(catInfo).filter(cat=>data[cat]).map(cat=>{const info=catInfo[cat];return `<button class="cat-card" data-cat="${cat}" data-emoji="${info[0]}" style="--grad:${info[3]}"><div class="cat-content"><div class="pill">${info[0]}</div><h2>${info[1]}</h2><p>${data[cat].length} ricette</p><p>${info[2]}</p></div></button>`}).join('');$$('#catGrid .cat-card').forEach(c=>c.onclick=()=>openCategory(c.dataset.cat));$('#loader').classList.add('hidden');updateFavButton();home()}).catch(err=>{$('#loader').textContent='Errore nel caricamento ricette: '+err.message});
