<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ninja SLUSHi Ricettario</title>
  <style>
    :root{--bg:#fff8ef;--paper:#fff;--ink:#1f1f1f;--muted:#6b625a;--accent:#e85d2a;--accent2:#0e8f8f;--line:#ead8c8;--soft:#fff0df}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}body.dark{--bg:#15110f;--paper:#211b18;--ink:#fff7ef;--muted:#cdbdaf;--accent:#ff7b43;--accent2:#55d7df;--line:#3a302b;--soft:#2b211d}.hero{padding:54px 22px;background:linear-gradient(135deg,#ffead5,#fff,#dff7f6);border-bottom:1px solid var(--line)}.dark .hero{background:linear-gradient(135deg,#2a170d,#1a1716,#0e2728)}.wrap{max-width:1120px;margin:auto}.kicker{color:var(--accent);font-weight:900;text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(2.2rem,6vw,5rem);line-height:.95;margin:.15em 0}.sticky{position:sticky;top:0;z-index:20;background:rgba(255,248,239,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.dark .sticky{background:rgba(21,17,15,.96)}.tools{max-width:1120px;margin:auto;padding:12px 22px;display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px}input,button,.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:11px 14px;font-size:1rem}button,.btn{font-weight:800;cursor:pointer;text-decoration:none}button:hover,.btn:hover{background:var(--accent);color:#fff}main{max-width:1120px;margin:auto;padding:22px}.panel,.recipe{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;margin:18px 0}.recipe{box-shadow:0 8px 24px rgba(80,40,10,.06);scroll-margin-top:105px}.recipe:target{outline:4px solid var(--accent)}h2{font-size:2rem;border-bottom:3px solid var(--accent);padding-bottom:8px}.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.toc-block{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:16px}.toc-block h3{color:var(--accent2);margin:.2rem 0 .6rem}.toc-links{display:flex;flex-direction:column;gap:5px}.toc-links a{display:block;color:var(--ink);text-decoration:none;padding:6px 8px;border-radius:10px}.toc-links a:hover{background:var(--accent);color:#fff}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.filter.active,.fav-on{background:var(--accent);color:#fff}.category{margin:36px 0 54px}.recipe-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{color:#fff;background:var(--accent2);border-radius:999px;padding:5px 10px;font-weight:900;font-size:.85rem}.back{color:var(--muted);font-weight:800;text-decoration:none}.recipe h3{font-size:1.45rem;margin:.7rem 0 .1rem}.meta{color:var(--muted);font-weight:800;margin-top:0}.recipe-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.recipe-actions button{padding:8px 11px;font-size:.9rem}.dose-label{color:var(--muted);font-weight:900;align-self:center}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}h4{color:var(--accent2);margin-bottom:.3rem}.tip{background:#fff7d6;border-left:5px solid #f0b400;border-radius:12px;padding:10px 12px}.hidden{display:none!important}.float-top{position:fixed;right:18px;bottom:18px;z-index:30}footer{text-align:center;color:var(--muted);padding:32px}@media(max-width:760px){.tools{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.recipe-actions button{flex:1;min-width:110px}}@media print{.sticky,.float-top,.back,.recipe-actions{display:none}body{background:#fff}.recipe{box-shadow:none;page-break-inside:avoid}}
  </style>
</head>
<body>
<header class="hero" id="home"><div class="wrap"><div class="kicker">App online</div><h1>Ninja SLUSHi<br>Ricettario</h1></div></header>
<div class="sticky"><div class="tools"><input id="search" type="search" placeholder="Scrivi una parola... es. caffè, rum, Nutella, limone"><button id="searchBtn">🔎 Cerca</button><button id="darkBtn">🌙 Scuro</button><button id="favFilter">♡ Preferiti</button><a class="btn" href="#indice">📚 Indice</a></div></div>
<main>
<section class="panel" id="indice"><h2>Indice per categoria</h2><p id="counter"></p><div class="filters" id="filters"></div><div class="toc-grid" id="toc"></div></section>
<section id="ricette"><h2 id="risultati">Risultati</h2><div id="recipes"></div></section>
</main><a class="btn float-top" href="#home">↑ Su</a><footer>Ricettario personale non ufficiale. Ninja e SLUSHi sono marchi dei rispettivi proprietari.</footer>
<script>
const data=[
['Granite','Granita al limone','Circa 1 litro',['700 ml acqua','220 ml succo di limone','170 g zucchero','Scorza di limone facoltativa'],['Sciogli lo zucchero nell\'acqua.','Aggiungi il succo filtrato.','Raffredda e versa nella SLUSHi.'],'La regina: non scendere troppo con lo zucchero.'],
['Granite','Granita al caffè','Circa 1 litro',['700 ml caffè freddo','250 ml acqua','130-160 g zucchero'],['Sciogli lo zucchero nel caffè tiepido.','Aggiungi acqua.','Raffredda e versa.'],'Con panna montata sopra è obbligatoria.'],
['Granite','Granita alla menta','Circa 1 litro',['800 ml acqua','160 ml sciroppo di menta','20 ml succo di limone'],['Mescola tutto.','Raffredda molto bene.','Versa nella macchina.'],'Freschissima.'],
['Granite','Granita alla fragola','Circa 1 litro',['500 g fragole','350 ml acqua','120 g zucchero','Succo di mezzo limone'],['Frulla tutto.','Filtra se vuoi.','Raffredda e versa.'],'Fragole mature, non quelle che sanno di cartone.'],
['Granite','Anguria e lime','Circa 1 litro',['750 g anguria senza semi','80 ml lime','60-100 g zucchero'],['Frulla.','Filtra se vuoi.','Raffredda e versa.'],'Ottima con menta.'],
['Frozen cocktail','Mojito Frozen','Circa 1 litro',['320 ml rum bianco','450 ml soda','120 ml lime','120-150 g zucchero','Menta'],['Pesta menta, zucchero e lime.','Aggiungi rum e soda.','Filtra se vuoi.','Raffredda e versa.'],'Il cavallo di battaglia.'],
['Frozen cocktail','Spritz Frozen','Circa 1 litro',['350 ml Aperol','300 ml prosecco','250 ml soda','50 ml succo arancia'],['Mescola piano.','Raffredda.','Versa.'],'Non usare prosecco da notaio.'],
['Frozen cocktail','Margarita Frozen','Circa 1 litro',['300 ml tequila','140 ml triple sec','170 ml lime','300 ml acqua','120 g zucchero'],['Sciogli zucchero in acqua.','Aggiungi alcol e lime.','Raffredda e versa.'],'Bordo bicchiere con sale.'],
['Frozen cocktail','Piña Colada Frozen','Circa 1 litro',['280 ml rum','380 ml succo ananas','250 ml latte cocco','80 g zucchero'],['Mescola o frulla.','Raffredda.','Versa.'],'Se è troppo densa aggiungi acqua.'],
['Frozen cocktail','Daiquiri fragola','Circa 1 litro',['280 ml rum bianco','400 g fragole','130 ml lime','120 g zucchero','150 ml acqua'],['Frulla tutto.','Filtra se vuoi.','Raffredda.'],'Sempre vincente.'],
['Cocktail analcolici','Virgin Mojito','Circa 1 litro',['700 ml soda','150 ml lime','130 g zucchero','Menta'],['Pesta menta, zucchero e lime.','Aggiungi soda.','Filtra e versa.'],'Zero alcol, massima freschezza.'],
['Cocktail analcolici','Finto Spritz','Circa 1 litro',['500 ml bitter analcolico','300 ml soda','150 ml succo arancia'],['Mescola.','Raffredda.','Versa.'],'Fa scena senza stendere nessuno.'],
['Frappè','Frappè al caffè','Circa 1 litro',['450 ml latte','250 ml caffè','80 g zucchero','100 ml panna facoltativa'],['Sciogli zucchero nel caffè.','Aggiungi latte.','Raffredda e versa.'],'Leggero ma serio.'],
['Frappè','Frappè al cioccolato','Circa 1 litro',['650 ml latte','35 g cacao','100 g zucchero'],['Sciogli cacao e zucchero con poco latte caldo.','Aggiungi latte freddo.','Raffredda.'],'Il cacao va sciolto prima.'],
['Milkshake','Milkshake Nutella','Circa 1 litro',['650 ml latte','180 g Nutella','100 ml panna'],['Scalda leggermente la Nutella.','Frulla con latte e panna.','Raffredda e versa.'],'Porcheria sublime.'],
['Milkshake','Milkshake Oreo','Circa 1 litro',['650 ml latte','8 Oreo','2 palline gelato vaniglia'],['Frulla benissimo.','Raffredda.','Versa.'],'Gli Oreo devono essere polverizzati.'],
['Caffè e bevande fredde','Cappuccino ghiacciato','Circa 1 litro',['500 ml latte','300 ml caffè','100 ml panna','80 g zucchero'],['Sciogli zucchero nel caffè.','Aggiungi latte e panna.','Raffredda e versa.'],'Meglio con caffè forte.'],
['Ricette ignoranti','Nutella Oreo devastante','Circa 1 litro',['650 ml latte','180 g Nutella','6 Oreo','100 ml panna'],['Frulla fino a liscio.','Raffredda.','Versa.'],'Non è una bevanda, è una dichiarazione di guerra.'],
['Ricette ignoranti','Red Bull slush','Circa 1 litro',['850 ml Red Bull','50 ml acqua','Zucchero solo se serve'],['Versa fredda.','Avvia.'],'Per gente che vuole sentire i colori.']
];
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const cats=[...new Set(data.map(r=>r[0]))];let active='Tutte',favOnly=false;const cards=[];
filters.innerHTML='<button class="filter active" data-cat="Tutte">Tutte</button>'+cats.map(c=>`<button class="filter" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
toc.innerHTML=cats.map(c=>`<section class="toc-block"><h3>${esc(c)}</h3><div class="toc-links">${data.filter(r=>r[0]==c).map(r=>`<a href="#${slug(r[1])}">${esc(r[1])}</a>`).join('')}</div></section>`).join('');
recipes.innerHTML=cats.map(c=>`<section class="category" data-category="${esc(c)}"><h2>${esc(c)}</h2>${data.filter(r=>r[0]==c).map(r=>{let id=slug(r[1]);let ing=r[3].map(x=>`<li data-original="${esc(x)}">${esc(x)}</li>`).join('');let proc=r[4].map(x=>`<li data-original="${esc(x)}">${esc(x)}</li>`).join('');return `<article class="recipe" id="${id}" data-category="${esc(r[0])}" data-search="${esc(r.flat(3).join(' ').toLowerCase())}"><div class="recipe-top"><span class="badge">${esc(r[0])}</span><a class="back" href="#indice">↑ indice</a></div><h3>${esc(r[1])}</h3><p class="meta">${esc(r[2])}</p><div class="recipe-actions"><button class="fav-btn">♡ Preferito</button><button class="dose-btn" data-scale="0.5">½ dose</button><button class="dose-btn" data-scale="1">dose base</button><button class="dose-btn" data-scale="2">doppia</button><span class="dose-label">Dose ×1</span></div><div class="cols"><section><h4>Ingredienti</h4><ul>${ing}</ul></section><section><h4>Procedura</h4><ol>${proc}</ol></section></div><p class="tip"><b>Consiglio:</b> ${esc(r[5])}</p></article>`}).join('')}</section>`).join('');
document.querySelectorAll('.recipe').forEach(card=>{cards.push(card);let key='fav_'+card.id,fb=card.querySelector('.fav-btn');if(localStorage.getItem(key)==='1'){card.classList.add('isFav');fb.classList.add('fav-on');fb.textContent='❤️ Preferito'}fb.onclick=()=>{let on=!card.classList.contains('isFav');card.classList.toggle('isFav',on);fb.classList.toggle('fav-on',on);fb.textContent=on?'❤️ Preferito':'♡ Preferito';localStorage.setItem(key,on?'1':'0');update()}});
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function update(){let q=norm(search.value),v=0;cards.forEach(card=>{let ok=(!q||norm(card.dataset.search).includes(q))&&(active==='Tutte'||card.dataset.category===active)&&(!favOnly||card.classList.contains('isFav'));card.classList.toggle('hidden',!ok);if(ok)v++});document.querySelectorAll('.category').forEach(cat=>cat.classList.toggle('hidden',![...cat.querySelectorAll('.recipe')].some(x=>!x.classList.contains('hidden'))));counter.textContent=`Mostro ${v} ricette/schede su ${cards.length}`}
searchBtn.onclick=()=>{update();ricette.scrollIntoView({behavior:'smooth'})};search.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchBtn.click()}};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.cat;update();ricette.scrollIntoView({behavior:'smooth'})});
favFilter.onclick=()=>{favOnly=!favOnly;favFilter.classList.toggle('fav-on',favOnly);favFilter.textContent=favOnly?'❤️ Solo preferiti':'♡ Preferiti';update()};
darkBtn.onclick=()=>{document.body.classList.toggle('dark');darkBtn.textContent=document.body.classList.contains('dark')?'☀️ Chiaro':'🌙 Scuro'};
document.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=e=>{let t=document.getElementById(a.getAttribute('href').slice(1));if(t){search.value='';active='Tutte';favOnly=false;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.cat==='Tutte'));favFilter.classList.remove('fav-on');favFilter.textContent='♡ Preferiti';update();e.preventDefault();setTimeout(()=>t.scrollIntoView({behavior:'smooth'}),30)}});
update();
</script>
</body>
</html>
