<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ninja SLUSHi</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#030712;color:#fff}button{font:inherit;cursor:pointer}.view{display:none}.view.on{display:block}.home,.page{min-height:100vh;padding:24px;background:radial-gradient(circle at 15% 8%,rgba(168,85,247,.28),transparent 26%),radial-gradient(circle at 88% 18%,rgba(56,189,248,.18),transparent 28%),linear-gradient(135deg,#030712,#07111f 60%,#020617)}.top{max-width:1180px;margin:0 auto 26px;display:flex;gap:18px;justify-content:space-between;align-items:center;padding:16px 18px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(3,7,18,.72);box-shadow:0 20px 60px #0008}.brand{display:flex;gap:14px;align-items:center}.logo{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#0ea5e9,#a855f7,#f97316)}.title{font-size:clamp(1.7rem,4vw,3.2rem);font-weight:1000;line-height:.9}.title span{background:linear-gradient(90deg,#fff,#38bdf8,#a855f7,#fb7185);-webkit-background-clip:text;color:transparent}.sub{color:#cbd5e1;font-weight:900;text-transform:uppercase;letter-spacing:.16em}.nav{display:flex;gap:10px;flex-wrap:wrap}.btn,.nav button,.search button,.card,.recipe-card{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;border-radius:999px;padding:10px 14px;font-weight:1000}.nav button:hover,.btn:hover,.search button:hover{background:#a855f7}.wrap{max-width:1180px;margin:auto}.head{display:flex;gap:18px;align-items:end;justify-content:space-between;margin:18px 0}.head h1{font-size:clamp(2.3rem,6vw,4.2rem);line-height:.92;margin:0}.head p{color:#cbd5e1;font-weight:800}.search{display:flex;gap:10px;min-width:min(430px,100%)}.search input{width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:13px 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.cat{position:relative;min-height:220px;text-align:left;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:var(--g);box-shadow:0 18px 55px #0008;color:#fff;padding:22px}.cat:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 22%,rgba(255,255,255,.32),transparent 18%),linear-gradient(180deg,transparent,rgba(0,0,0,.70))}.cat:after{content:attr(data-ico);position:absolute;right:20px;top:12px;font-size:90px;filter:drop-shadow(0 16px 24px #0008)}.cat>*{position:relative;z-index:1}.cat div{position:absolute;left:22px;right:22px;bottom:18px}.cat h2{margin:0;font-size:1.9rem;text-transform:uppercase;line-height:1}.cat p{margin:.35rem 0 0;color:#dbeafe;font-weight:850}.hero{position:relative;overflow:hidden;border-radius:32px;padding:28px;margin-bottom:18px;background:var(--g);box-shadow:0 22px 70px #0008;border:1px solid rgba(255,255,255,.14)}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 20%,rgba(255,255,255,.26),transparent 18%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.44))}.hero>*{position:relative}.hero h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:.92;margin:0;text-transform:uppercase}.hero p{font-weight:850;color:#e5e7eb}.bar{position:sticky;top:0;z-index:9;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;padding:8px;border-radius:999px;background:rgba(3,7,18,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.10)}.recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.recipe-card{border-radius:24px;min-height:130px;text-align:left;padding:18px;position:relative;box-shadow:0 14px 38px #0006}.recipe-card:hover,.cat:hover{transform:translateY(-3px);transition:.16s}.recipe-card:after{content:"→";position:absolute;right:18px;bottom:14px;font-size:26px;color:#38bdf8}.recipe-card strong{display:block;font-size:1.13rem;line-height:1.15}.recipe-card span{display:block;margin-top:8px;color:#cbd5e1;font-weight:850}.recipes{display:grid;gap:18px}.recipe{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.10)!important;color:#fff!important;border-radius:26px!important;padding:22px!important;margin:0!important;box-shadow:0 16px 45px #0006;scroll-margin-top:16px}.recipe .recipe-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.recipe .badge{display:inline-flex!important;align-items:center;gap:8px;width:auto!important;height:auto!important;border-radius:999px!important;padding:6px 12px!important;background:#0e8f8f!important;color:white!important;font-size:.85rem!important;box-shadow:none!important}.recipe .back{display:none!important}.recipe h3{font-size:1.7rem;margin:.8rem 0 .1rem}.recipe .meta{color:#cbd5e1;font-weight:850}.recipe button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 11px;font-weight:900}.recipe .dose-btn.active{background:#38bdf8!important;color:#06111f!important}.recipe .fav-on,.fav-on{background:#e11d48!important;border-color:#fb7185!important}.recipe .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.recipe .cols section{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px}.recipe h4{color:#38bdf8}.recipe .tip{background:rgba(250,204,21,.10)!important;border-left:5px solid #facc15!important;border-radius:12px;padding:10px 12px}.loading{margin:20vh auto;text-align:center;color:#cbd5e1;font-weight:1000}@media(max-width:900px){.grid,.recipe-grid{grid-template-columns:repeat(2,1fr)}.head{display:block}.search{margin-top:16px}}@media(max-width:640px){.home,.page{padding:14px}.top{align-items:flex-start}.nav{width:100%}.grid,.recipe-grid{grid-template-columns:1fr}.recipe .cols{grid-template-columns:1fr}.cat{min-height:190px}.cat:after{font-size:78px}.search{flex-direction:column}.bar{border-radius:22px}.hero{padding:22px}}</style></head><body><div id="load" class="loading">Carico ricette Ninja SLUSHi...</div><section id="home" class="view home"><div class="top"><div class="brand"><div class="logo">🥷</div><div><div class="title">NINJA <span>SLUSHi</span></div><div class="sub">Il ricettario definitivo</div></div></div><div class="nav"><button id="all">Tutte A-Z</button><button id="fav">♡ Preferiti</button></div></div><div class="wrap"><div class="head"><div><h1>Scegli una categoria</h1><p>Entri nell’indice categoria, poi apri la ricetta.</p></div><div class="search"><input id="q" placeholder="Cerca... mojito, caffè, Nutella"><button id="go">🔎 Cerca</button></div></div><div id="cats" class="grid"></div></div></section><section id="catPage" class="view page"><div class="wrap"><div class="bar"><button class="btn" id="home1">🏠 Torna alla home</button></div><div id="catHero"></div><div id="list" class="recipe-grid"></div></div></section><section id="recipePage" class="view page"><div class="wrap"><div class="bar"><button class="btn" id="back">← Torna all’indice categoria</button><button class="btn" id="home2">🏠 Torna alla home</button></div><div id="recipes" class="recipes"></div></div></section><script>(()=>{const info={"Regole base e consigli":["🧭","Guida rapida","Regole pratiche, formule base e trucchi per non fare disastri.","linear-gradient(135deg,#1f2937,#0f172a)"],"Granite classiche":["❄️","Granite","Limone, caffè, menta, cola e i grandi classici da banco bar.","linear-gradient(135deg,#0f766e,#38bdf8)"],"Granite alla frutta":["🍓","Frutta","Frutta vera, colori forti e sapori freschi senza effetto sciroppone.","linear-gradient(135deg,#be123c,#f59e0b)"],"Frozen cocktail":["🍹","Frozen cocktail","Mojito, Spritz, Margarita, Daiquiri e tutto il reparto festa.","linear-gradient(135deg,#7c2d12,#ea580c)"],"Cocktail analcolici":["🍸","Analcolici","Drink belli da vedere, freschi da bere e senza stendere nessuno.","linear-gradient(135deg,#065f46,#84cc16)"],"Frappè":["🧋","Frappè","Frappè veri, più pertinenti e ben distinti dai caffè freddi.","linear-gradient(135deg,#7c2d12,#f59e0b)"],"Milkshake":["🥤","Milkshake","Nutella, Oreo, Kinder, pistacchio e roba poco innocente.","linear-gradient(135deg,#3f1d13,#a855f7)"],"Caffè e bevande fredde":["☕","Caffè freddi","Cappuccini ghiacciati, mocha, tè frozen e bevande fredde serie.","linear-gradient(135deg,#422006,#92400e)"],"Smoothie ghiacciati":["🥭","Smoothie","Frutta, yogurt e bevande un filo più leggere.","linear-gradient(135deg,#14532d,#22c55e)"],"Ricette ignoranti":["😈","Ignoranti","Nutella, Oreo, Red Bull, Kinder: qui il dietologo cambia mestiere.","linear-gradient(135deg,#111827,#dc2626)"],"Amari e digestivi frozen":["🥃","Amari frozen","Amari, sambuca, brandy e digestivi ghiacciati da fine cena.","linear-gradient(135deg,#3f1d13,#b45309)"],"Dessert freddi":["🍨","Dessert","Sorbetti, tiramisù, creme, cacao e dolci freddi al bicchiere.","linear-gradient(135deg,#581c87,#ec4899)"]};let data={},cur=null,last=null;const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],ico=c=>(info[c]?.[0]||"🥷"),title=r=>(r.querySelector("h3")?.textContent||"Ricetta").trim(),meta=r=>(r.querySelector(".meta")?.textContent||r.dataset.category||"").trim(),sort=a=>a.slice().sort((x,y)=>title(x).localeCompare(title(y),"it",{sensitivity:"base"}));function show(id){$$('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');scrollTo({top:0,behavior:'smooth'})}function get(k){try{return localStorage.getItem(k)}catch{return null}}function set(k,v){try{localStorage.setItem(k,v)}catch{}}function favOn(r){return get('slushi_fav_'+r.id)==='1'}function favCount(){let n=Object.values(data).flat().filter(favOn).length;$('#fav').textContent=n?'❤️ Preferiti '+n:'♡ Preferiti';$('#fav').classList.toggle('fav-on',n>0)}function num(n){return Math.abs(n-Math.round(n))<.05?String(Math.round(n)):String(Math.round(n*10)/10).replace('.',',')}function scale(t,s){t=String(t||'');t=t.replace(/(\d+(?:[,.]\d+)?)(\s*-\s*)(\d+(?:[,.]\d+)?)/g,(m,a,sep,b)=>num(parseFloat(a.replace(',','.'))*s)+sep+num(parseFloat(b.replace(',','.'))*s));return t.replace(/(^|[^\w])(\d+(?:[,.]\d+)?)(?=\s*(ml|g|kg|l|cl|cucchiai|cucchiaio|cucchiaini|cucchiaino|banane|banana|fragole|oreo|palline|barrette|lime|limoni|limone|kiwi|pezzi|bottiglie)\b)/gi,(m,p,n)=>p+num(parseFloat(n.replace(',','.'))*s))}function wire(card){let cat=card.dataset.category||'',b=card.querySelector('.badge');if(b)b.textContent=ico(cat)+' '+cat;let f=card.querySelector('.fav-btn'),key='slushi_fav_'+card.id;if(f){let on=get(key)==='1';card.classList.toggle('isFav',on);f.classList.toggle('fav-on',on);f.textContent=on?'❤️ Preferito':'♡ Preferito';f.onclick=()=>{let now=!card.classList.contains('isFav');card.classList.toggle('isFav',now);f.classList.toggle('fav-on',now);f.textContent=now?'❤️ Preferito':'♡ Preferito';set(key,now?'1':'0');favCount()}}$$('.dose-btn',card).forEach(btn=>btn.onclick=()=>{let s=parseFloat(btn.dataset.scale);$$('li',card).forEach(li=>{let o=li.dataset.original||li.textContent;li.textContent=scale(o,s)});$$('.dose-btn',card).forEach(x=>x.classList.remove('active'));btn.classList.add('active');let lab=card.querySelector('.dose-label');if(lab)lab.textContent='Dose ×'+String(s).replace('.',',')})}function clone(r){let c=r.cloneNode(true);$$('.back',c).forEach(x=>x.remove());wire(c);return c}function home(){last=null;show('#home');favCount()}function hero(name,desc,grad,emoji='📚'){return `<div class="hero" style="--g:${grad}"><p>${emoji} Categoria</p><h1>${name}</h1><p>${desc}</p></div>`}function openCat(cat){last=null;cur=cat;let i=info[cat]||['🥷',cat,'Ricette della categoria.','linear-gradient(135deg,#111827,#7c3aed)'],arr=sort(data[cat]||[]);$('#catHero').innerHTML=hero(cat,i[2],i[3],i[0]);$('#list').innerHTML=arr.map(r=>`<button class="recipe-card" data-id="${r.id}"><strong>${i[0]} ${title(r)}</strong><span>${i[0]} ${meta(r)}</span></button>`).join('');$$('#list .recipe-card').forEach(b=>b.onclick=()=>openRecipe(cat,b.dataset.id));show('#catPage')}function openRecipe(cat,id){cur=cat;let arr=sort(data[cat]||[]),idx=Math.max(0,arr.findIndex(r=>r.id===id));let ord=arr.slice(idx).concat(arr.slice(0,idx));$('#recipes').innerHTML='';ord.forEach(r=>$('#recipes').appendChild(clone(r)));show('#recipePage')}function openFrom(list,id,label){last=list;cur=label;let idx=Math.max(0,list.findIndex(x=>x.r.id===id));$('#recipes').innerHTML='';list.slice(idx).concat(list.slice(0,idx)).forEach(x=>$('#recipes').appendChild(clone(x.r)));show('#recipePage')}function openList(name,desc,list,grad){$('#catHero').innerHTML=hero(name,desc,grad,'📚');$('#list').innerHTML=list.map(x=>`<button class="recipe-card" data-id="${x.r.id}"><strong>${ico(x.cat)} ${title(x.r)}</strong><span>${ico(x.cat)} ${x.cat}</span></button>`).join('');$$('#list .recipe-card').forEach(b=>b.onclick=()=>openFrom(list,b.dataset.id,name));show('#catPage')}function all(){last='all';let list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>list.push({cat,r})));list.sort((a,b)=>title(a.r).localeCompare(title(b.r),'it',{sensitivity:'base'}));openList('Tutte A-Z',list.length+' ricette in ordine alfabetico.',list,'linear-gradient(135deg,#111827,#7c3aed)')}function fav(){let list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>{if(favOn(r))list.push({cat,r})}));list.sort((a,b)=>title(a.r).localeCompare(title(b.r),'it',{sensitivity:'base'}));if(!list.length)return alert('Ancora nessuna ricetta nei preferiti.');last='fav';openList('Preferiti',list.length+' ricette salvate nei preferiti.',list,'linear-gradient(135deg,#831843,#e11d48)')}function search(){let q=$('#q').value.trim().toLowerCase();if(!q)return;let list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>{let t=(r.dataset.search||r.textContent||'').toLowerCase();if(t.includes(q))list.push({cat,r})}));list.sort((a,b)=>title(a.r).localeCompare(title(b.r),'it',{sensitivity:'base'}));last='search';openList(q,list.length+' risultati trovati in ordine alfabetico.',list,'linear-gradient(135deg,#111827,#7c3aed)')}$('#home1').onclick=$('#home2').onclick=home;$('#back').onclick=()=>last==='all'?all():last==='fav'?fav():last==='search'?search():cur&&data[cur]?openCat(cur):home();$('#all').onclick=all;$('#fav').onclick=fav;$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};fetch('./index.html?v='+Date.now()).then(r=>r.text()).then(html=>{let doc=new DOMParser().parseFromString(html,'text/html');$$('article.recipe',doc).forEach(r=>{let c=r.dataset.category||'Altro';(data[c]||(data[c]=[])).push(r)});$('#cats').innerHTML=Object.keys(info).filter(c=>data[c]).map(c=>{let i=info[c];return `<button class="cat" data-ico="${i[0]}" style="--g:${i[3]}" data-cat="${c}"><div><h2>${i[1]}</h2><p>${data[c].length} ricette</p><p>${i[2]}</p></div></button>`}).join('');$$('.cat').forEach(c=>c.onclick=()=>openCat(c.dataset.cat));$('#load').style.display='none';home()}).catch(e=>{$('#load').textContent='Errore caricamento: '+e.message})})();</script></body></html>
