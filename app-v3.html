<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninja SLUSHi - App V3</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#030712;color:white}button{font:inherit}.view{display:none}.view.active{display:block}.home{min-height:100vh;padding:28px 22px 54px;background:radial-gradient(circle at 15% 10%,rgba(168,85,247,.24),transparent 28%),radial-gradient(circle at 85% 20%,rgba(56,189,248,.18),transparent 30%),linear-gradient(135deg,#030712,#07111f 55%,#020617)}.bar{max-width:1180px;margin:0 auto 28px;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 18px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(3,7,18,.72);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.28)}.logo{display:flex;align-items:center;gap:14px}.badge{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#0ea5e9,#a855f7,#f97316);box-shadow:0 0 28px rgba(168,85,247,.35);font-size:34px}.title{font-size:clamp(1.6rem,4vw,3.2rem);font-weight:1000;line-height:.95}.title span{background:linear-gradient(90deg,#fff,#38bdf8,#a855f7,#fb7185);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:#cbd5e1;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.nav{display:flex;gap:12px;flex-wrap:wrap}.nav button,.btn{color:#e5e7eb;text-decoration:none;font-weight:900;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer}.nav button:hover,.btn:hover{background:#a855f7;color:white}.nav button.fav-on,.btn.fav-on,.recipe .fav-on{background:#e11d48!important;color:#fff!important;border-color:#fb7185!important}.main{max-width:1180px;margin:auto}.headline{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:26px 0 18px}.headline h1{font-size:clamp(2.2rem,5vw,4rem);margin:0;line-height:.95}.headline p{margin:.4rem 0 0;color:#cbd5e1;font-size:1.1rem;font-weight:800}.search{display:flex;gap:10px;min-width:min(430px,100%)}.search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:white;border-radius:999px;padding:13px 16px;font-size:1rem}.search input::placeholder{color:#94a3b8}.search button{border:0;border-radius:999px;background:#a855f7;color:white;font-weight:900;padding:13px 18px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.cat-card{position:relative;min-height:220px;border-radius:26px;overflow:hidden;text-decoration:none;color:white;border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.35);background:var(--grad);isolation:isolate;cursor:pointer;text-align:left;padding:0}.cat-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 25%,rgba(255,255,255,.34),transparent 18%),linear-gradient(180deg,transparent 0%,rgba(0,0,0,.72) 100%);z-index:-1}.cat-card:after{content:attr(data-emoji);position:absolute;right:22px;top:16px;font-size:96px;filter:drop-shadow(0 18px 26px rgba(0,0,0,.38));opacity:.95}.cat-card:hover,.recipe-card:hover{transform:translateY(-4px);transition:.18s ease;box-shadow:0 24px 70px rgba(0,0,0,.48)}.cat-content{position:absolute;left:22px;right:22px;bottom:20px}.pill{display:inline-flex;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);align-items:center;justify-content:center;font-size:30px;margin-bottom:12px}.cat-card h2{font-size:1.9rem;margin:0;text-transform:uppercase;line-height:1}.cat-card p{color:#dbeafe;margin:.35rem 0 0;font-weight:800}.screen{min-height:100vh;padding:24px 22px 60px;background:radial-gradient(circle at 12% 10%,rgba(168,85,247,.17),transparent 28%),linear-gradient(135deg,#030712,#07111f 55%,#020617)}.wrap{max-width:1180px;margin:auto}.cat-hero{position:relative;overflow:hidden;border-radius:32px;padding:28px;margin:0 0 18px;background:var(--grad);box-shadow:0 22px 70px rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.14)}.cat-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 20%,rgba(255,255,255,.26),transparent 18%),linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.42))}.cat-hero>*{position:relative;z-index:1}.kicker{font-weight:1000;text-transform:uppercase;letter-spacing:.18em;color:#dbeafe;margin:0 0 8px}.cat-title{font-size:clamp(2.3rem,6vw,4.4rem);line-height:.92;margin:0;text-transform:uppercase}.cat-desc{font-weight:800;color:#e5e7eb;max-width:760px;margin:12px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.recipe-card{position:relative;min-height:128px;text-align:left;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;border-radius:24px;padding:18px;cursor:pointer;box-shadow:0 14px 38px rgba(0,0,0,.24);overflow:hidden}.recipe-card:after{content:"→";position:absolute;right:18px;bottom:14px;font-size:26px;color:#38bdf8;font-weight:1000}.recipe-card strong{display:block;font-size:1.15rem;line-height:1.15}.recipe-card span{display:block;color:#cbd5e1;margin-top:8px;font-weight:800;font-size:.9rem}.recipe-wrap{display:grid;gap:18px}.recipe{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.10)!important;box-shadow:0 16px 45px rgba(0,0,0,.28)!important;color:#f8fafc!important;border-radius:26px!important;padding:22px!important;margin:0!important;scroll-margin-top:18px}.recipe .recipe-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.recipe .badge{background:#0e8f8f;color:white;border-radius:999px;padding:5px 10px;font-weight:900;font-size:.85rem}.recipe .back{display:none}.recipe h3{font-size:1.7rem;margin:.7rem 0 .1rem}.recipe .meta{color:#cbd5e1;font-weight:800}.recipe button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 11px;font-weight:900;cursor:pointer}.recipe button:hover{background:#a855f7}.recipe .dose-btn.active{background:#38bdf8!important;color:#07111f!important}.recipe .dose-label{color:#cbd5e1;font-weight:1000;display:inline-flex;align-items:center}.recipe .recipe-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.recipe .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.recipe .cols section{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px}.recipe h4{color:#38bdf8}.recipe .tip{background:rgba(250,204,21,.10)!important;border-left:5px solid #facc15!important;color:#fff;border-radius:12px;padding:10px 12px}.topbar{position:sticky;top:0;z-index:10;background:rgba(3,7,18,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:8px;margin:0 0 18px;display:flex;gap:8px;flex-wrap:wrap}.loader{max-width:900px;margin:20vh auto;text-align:center;color:#cbd5e1;font-weight:900}.hidden{display:none!important}@media(max-width:980px){.grid,.recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.headline{display:block}.search{margin-top:16px}}@media(max-width:640px){.bar{align-items:flex-start}.nav{display:flex;width:100%}.grid,.recipe-grid{grid-template-columns:1fr}.cat-card{min-height:190px}.cat-card:after{font-size:82px}.search{flex-direction:column}.recipe .cols{grid-template-columns:1fr}.screen{padding:14px 12px 50px}.cat-hero{padding:22px}.cat-title{font-size:2.25rem}}
</style>
</head>
<body>
<div id="loader" class="loader">Carico ricette Ninja SLUSHi...</div>
<section id="homeView" class="view home"><div class="bar"><div class="logo"><div class="badge">🥷</div><div><div class="title">NINJA <span>SLUSHi</span></div><div class="sub">Il ricettario definitivo</div></div></div><nav class="nav"><button id="homeBtn">Home</button><button id="allBtn">Tutte A-Z</button><button id="favBtn">♡ Preferiti</button></nav></div><div class="main"><div class="headline"><div><h1>Scegli una categoria</h1><p>Prima entri nell'indice categoria, poi apri la ricetta. Finalmente stile app.</p></div><div class="search"><input id="searchBox" placeholder="Cerca... mojito, caffè, Nutella"><button id="searchBtn">🔎 Cerca</button></div></div><div id="catGrid" class="grid"></div></div></section>
<section id="catView" class="view screen"><div class="wrap"><div class="topbar"><button class="btn" id="catHomeBtn">🏠 Torna alla home</button></div><div id="catHero"></div><div id="recipeGrid" class="recipe-grid"></div></div></section>
<section id="recipeView" class="view screen"><div class="wrap"><div class="topbar"><button class="btn" id="backCatBtn">← Torna all’indice categoria</button><button class="btn" id="recipeHomeBtn">🏠 Torna alla home</button></div><div id="recipeList" class="recipe-wrap"></div></div></section>
<script>
(function(){
const catInfo={
 'Regole base e consigli':['🧭','Guida rapida','Regole pratiche, formule base e trucchi per non fare disastri.','linear-gradient(135deg,#1f2937,#0f172a)'],
 'Granite classiche':['❄️','Granite','Limone, caffè, menta, cola e i grandi classici da banco bar.','linear-gradient(135deg,#0f766e,#38bdf8)'],
 'Granite alla frutta':['🍓','Frutta','Frutta vera, colori forti e sapori freschi senza effetto sciroppone.','linear-gradient(135deg,#be123c,#f59e0b)'],
 'Frozen cocktail':['🍹','Frozen cocktail','Mojito, Spritz, Margarita, Daiquiri e tutto il reparto festa.','linear-gradient(135deg,#7c2d12,#ea580c)'],
 'Cocktail analcolici':['🍸','Analcolici','Drink belli da vedere, freschi da bere e senza stendere nessuno.','linear-gradient(135deg,#065f46,#84cc16)'],
 'Frappè':['☕','Frappè','Caffè, cacao, banana, vaniglia e ricette fredde cremose.','linear-gradient(135deg,#78350f,#d97706)'],
 'Milkshake':['🥤','Milkshake','Nutella, Oreo, Kinder, pistacchio e roba poco innocente.','linear-gradient(135deg,#3f1d13,#a855f7)'],
 'Caffè e bevande fredde':['☕','Caffè freddi','Cappuccini ghiacciati, mocha, tè frozen e bevande fredde serie.','linear-gradient(135deg,#422006,#92400e)'],
 'Smoothie ghiacciati':['🥭','Smoothie','Frutta, yogurt e bevande un filo più leggere, senza fare i santi.','linear-gradient(135deg,#14532d,#22c55e)'],
 'Ricette ignoranti':['😈','Ignoranti','Nutella, Oreo, Red Bull, Kinder: qui il dietologo cambia mestiere.','linear-gradient(135deg,#111827,#dc2626)'],
 'Amari e digestivi frozen':['🥃','Amari frozen','Amari, sambuca, brandy e digestivi ghiacciati da fine cena.','linear-gradient(135deg,#3f1d13,#b45309)'],
 'Dessert freddi':['🍨','Dessert','Sorbetti, tiramisù, creme, cacao e dolci freddi al bicchiere.','linear-gradient(135deg,#581c87,#ec4899)']
};
let data={}, currentCat=null, lastSpecial=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function fmtNum(n){if(Math.abs(n-Math.round(n))<.05)return String(Math.round(n));return String(Math.round(n*10)/10).replace('.',',')}
function scaleText(text,scale){text=String(text||'');text=text.replace(/(\d+(?:[,.]\d+)?)(\s*-\s*)(\d+(?:[,.]\d+)?)/g,(m,a,sep,b)=>fmtNum(parseFloat(a.replace(',','.'))*scale)+sep+fmtNum(parseFloat(b.replace(',','.'))*scale));text=text.replace(/(^|[^\w])(\d+(?:[,.]\d+)?)(?=\s*(ml|g|kg|l|cl|cucchiai|cucchiaio|cucchiaini|cucchiaino|banane|banana|fragole|oreo|palline|barrette|lime|limoni|limone|kiwi|pezzi|bottiglie)\b)/gi,(m,p,n)=>p+fmtNum(parseFloat(n.replace(',','.'))*scale));return text}
function show(id){$$('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function recipeTitle(el){return (el.querySelector('h3')?.textContent||'Ricetta').trim()}
function recipeMeta(el){return (el.querySelector('.meta')?.textContent||el.dataset.category||'').trim()}
function sorted(arr){return arr.slice().sort((a,b)=>recipeTitle(a).localeCompare(recipeTitle(b),'it',{sensitivity:'base'}))}
function isFav(el){return safeGet('slushi_fav_'+el.id)==='1'}
function wireRecipe(card){
 const favBtn=card.querySelector('.fav-btn'), doseBtns=$$('.dose-btn',card), doseLabel=card.querySelector('.dose-label'), key='slushi_fav_'+card.id;
 if(favBtn){const on=safeGet(key)==='1';card.classList.toggle('isFav',on);favBtn.classList.toggle('fav-on',on);favBtn.textContent=on?'❤️ Preferito':'♡ Preferito';favBtn.onclick=function(){const now=!card.classList.contains('isFav');card.classList.toggle('isFav',now);favBtn.classList.toggle('fav-on',now);favBtn.textContent=now?'❤️ Preferito':'♡ Preferito';safeSet(key,now?'1':'0');updateFavButton()}}
 doseBtns.forEach(btn=>{btn.onclick=function(){const scale=parseFloat(btn.getAttribute('data-scale'));$$('li',card).forEach(li=>{const original=li.getAttribute('data-original')||li.textContent;li.textContent=scaleText(original,scale)});doseBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(doseLabel)doseLabel.textContent='Dose ×'+String(scale).replace('.',',')}});
}
function cleanRecipe(el){let c=el.cloneNode(true);c.querySelectorAll('.back').forEach(x=>x.remove());wireRecipe(c);return c}
function home(){lastSpecial=null;show('#homeView');updateFavButton()}
function updateFavButton(){const b=$('#favBtn');if(!b)return;const n=Object.values(data).flat().filter(isFav).length;b.textContent=n?'❤️ Preferiti '+n:'♡ Preferiti';b.classList.toggle('fav-on',n>0)}
function openCategory(cat){lastSpecial=null;currentCat=cat;const info=catInfo[cat]||['🥷',cat,'Ricette della categoria.','linear-gradient(135deg,#111827,#7c3aed)'];const arr=sorted(data[cat]||[]);$('#catHero').innerHTML=`<div class="cat-hero" style="--grad:${info[3]}"><p class="kicker">${info[0]} Categoria</p><h1 class="cat-title">${cat}</h1><p class="cat-desc">${info[2]}</p><div class="actions"><button class="btn" onclick="window.slushiHome()">🏠 Torna alla home</button></div></div>`;$('#recipeGrid').innerHTML=arr.map((r,i)=>`<button class="recipe-card" data-id="${r.id}"><strong>${recipeTitle(r)}</strong><span>${recipeMeta(r)}</span></button>`).join('');$$('#recipeGrid .recipe-card').forEach(b=>b.onclick=()=>openRecipe(cat,b.dataset.id));show('#catView')}
function openRecipe(cat,recipeId){currentCat=cat;const arr=sorted(data[cat]||[]);let idx=Math.max(0,arr.findIndex(r=>r.id===recipeId));const ordered=arr.slice(idx).concat(arr.slice(0,idx));$('#recipeList').innerHTML='';ordered.forEach(r=>$('#recipeList').appendChild(cleanRecipe(r)));show('#recipeView')}
function openRecipeFromList(list,recipeId,backLabel){lastSpecial=list;currentCat=backLabel;let idx=Math.max(0,list.findIndex(x=>x.r.id===recipeId));let ordered=list.slice(idx).concat(list.slice(0,idx));$('#recipeList').innerHTML='';ordered.forEach(x=>$('#recipeList').appendChild(cleanRecipe(x.r)));show('#recipeView')}
function openList(title,desc,list,grad){$('#catHero').innerHTML=`<div class="cat-hero" style="--grad:${grad||'linear-gradient(135deg,#111827,#7c3aed)'}"><p class="kicker">📚 Elenco</p><h1 class="cat-title">${title}</h1><p class="cat-desc">${desc}</p><div class="actions"><button class="btn" onclick="window.slushiHome()">🏠 Torna alla home</button></div></div>`;$('#recipeGrid').innerHTML=list.map(x=>`<button class="recipe-card" data-id="${x.r.id}"><strong>${recipeTitle(x.r)}</strong><span>${x.cat}</span></button>`).join('');$$('#recipeGrid .recipe-card').forEach(b=>b.onclick=()=>openRecipeFromList(list,b.dataset.id,title));show('#catView')}
function allList(){lastSpecial='all';const list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>list.push({cat,r})));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));openList('Tutte A-Z',list.length+' ricette in ordine alfabetico.',list,'linear-gradient(135deg,#111827,#7c3aed)')}
function favList(){const list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>{if(isFav(r))list.push({cat,r})}));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));if(!list.length){alert('Ancora nessuna ricetta nei preferiti. Apri una ricetta e premi ♡ Preferito.');return}lastSpecial='fav';openList('Preferiti',list.length+' ricette salvate nei preferiti.',list,'linear-gradient(135deg,#831843,#e11d48)')}
function search(){const q=$('#searchBox').value.trim().toLowerCase();if(!q)return;let list=[];Object.entries(data).forEach(([cat,arr])=>arr.forEach(r=>{const t=(r.getAttribute('data-search')||r.textContent||'').toLowerCase();if(t.includes(q))list.push({cat,r})}));list.sort((a,b)=>recipeTitle(a.r).localeCompare(recipeTitle(b.r),'it',{sensitivity:'base'}));lastSpecial='search';openList(q,list.length+' risultati trovati in ordine alfabetico.',list,'linear-gradient(135deg,#111827,#7c3aed)')}
window.slushiHome=home;
$('#catHomeBtn').onclick=home;$('#recipeHomeBtn').onclick=home;$('#backCatBtn').onclick=()=>{if(lastSpecial==='all')allList();else if(lastSpecial==='fav')favList();else if(lastSpecial==='search')search();else if(currentCat&&data[currentCat])openCategory(currentCat);else home()};$('#homeBtn').onclick=home;$('#allBtn').onclick=allList;$('#favBtn').onclick=favList;$('#searchBtn').onclick=search;$('#searchBox').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
fetch('./index.html?source='+Date.now()).then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');const recipes=Array.from(doc.querySelectorAll('article.recipe'));recipes.forEach(r=>{const cat=r.getAttribute('data-category')||'Altro';if(!data[cat])data[cat]=[];data[cat].push(r)});$('#catGrid').innerHTML=Object.keys(catInfo).filter(cat=>data[cat]).map(cat=>{const info=catInfo[cat];return `<button class="cat-card" data-cat="${cat}" data-emoji="${info[0]}" style="--grad:${info[3]}"><div class="cat-content"><div class="pill">${info[0]}</div><h2>${info[1]}</h2><p>${data[cat].length} ricette</p><p>${info[2]}</p></div></button>`}).join('');$$('#catGrid .cat-card').forEach(c=>c.onclick=()=>openCategory(c.dataset.cat));$('#loader').classList.add('hidden');updateFavButton();home()}).catch(err=>{$('#loader').textContent='Errore nel caricamento ricette: '+err.message});
})();
</script>
</body>
</html>
