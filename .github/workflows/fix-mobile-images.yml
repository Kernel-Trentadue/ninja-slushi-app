name: Fix mobile recipe images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-mobile-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile image CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          css = r'''
/* FIX MOBILE IMMAGINI RICETTE */
.recipe-photo-wrap{margin:14px 0 18px!important;overflow:hidden!important;border-radius:18px!important}
.recipe-photo,.recipe img.recipe-photo{display:block!important;width:100%!important;max-width:760px!important;height:auto!important;max-height:360px!important;aspect-ratio:16/9!important;object-fit:cover!important;border-radius:18px!important;border:1px solid rgba(255,255,255,.12)!important;box-shadow:0 12px 34px rgba(0,0,0,.30)!important;background:#111827!important}
.recipe-photo-placeholder{display:flex;align-items:center;justify-content:center;width:100%;max-width:760px;aspect-ratio:16/9;border-radius:18px;border:1px dashed rgba(255,255,255,.18);color:#cbd5e1;font-weight:900;text-align:center;padding:18px;background:rgba(255,255,255,.06)}
.recipe-photo-note{display:none!important}
@media(max-width:640px){
  .recipe{padding:14px!important;border-radius:20px!important}
  .recipe-photo-wrap{margin:10px 0 14px!important;border-radius:16px!important}
  .recipe-photo,.recipe img.recipe-photo{width:100%!important;max-width:100%!important;height:185px!important;max-height:185px!important;aspect-ratio:auto!important;object-fit:cover!important;border-radius:16px!important;box-shadow:0 8px 22px rgba(0,0,0,.28)!important}
  .recipe-photo-placeholder{max-width:100%;height:185px!important;aspect-ratio:auto!important;border-radius:16px!important;font-size:.9rem!important}
  .recipe h3{font-size:1.35rem!important;line-height:1.08!important;margin:.65rem 0 .15rem!important}
  .recipe .recipe-top{align-items:flex-start!important;gap:8px!important}
  .recipe .badge{font-size:.74rem!important;padding:5px 10px!important}
}
@media(max-width:380px){.recipe-photo,.recipe img.recipe-photo,.recipe-photo-placeholder{height:165px!important}}
/* FINE FIX MOBILE IMMAGINI RICETTE */
'''

          for file in ['index.html','app-v3.html']:
              p = Path(file)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if 'FIX MOBILE IMMAGINI RICETTE' in s:
                  continue
              if '</style>' in s:
                  s = s.replace('</style>', css + '\n</style>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v3.html
          git diff --cached --quiet || git commit -m "Fix mobile recipe image sizing"
          git push
