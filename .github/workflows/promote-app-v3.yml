name: Promote App V3

on:
  push:
    paths:
      - '.github/workflows/promote-app-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote app-v3 to homepage safely
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          source = Path('ricette-source.html')
          app = Path('app-v3.html')

          if not source.exists():
              source.write_text(index.read_text(encoding='utf-8'), encoding='utf-8')

          html = app.read_text(encoding='utf-8')
          html = html.replace('./index.html?v=', './ricette-source.html?v=')
          html = html.replace('./index.html?source=', './ricette-source.html?source=')
          html = html.replace('fetch("./index.html?v="', 'fetch("./ricette-source.html?v="')
          html = html.replace("fetch('./index.html?v='", "fetch('./ricette-source.html?v='")
          html = html.replace('fetch("./index.html?source="', 'fetch("./ricette-source.html?source="')
          html = html.replace("fetch('./index.html?source='", "fetch('./ricette-source.html?source='")

          index.write_text(html, encoding='utf-8')
          app.write_text(html, encoding='utf-8')

          Path('.github/workflows/promote-app-v3.yml').unlink(missing_ok=True)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v3.html ricette-source.html .github/workflows/promote-app-v3.yml
          git diff --cached --quiet || git commit -m "Promote App V3 to homepage"
          git push
