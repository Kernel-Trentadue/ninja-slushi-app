name: Step 2 Categorie

on:
  push:
    paths:
      - '.github/workflows/step2-categorie.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html category UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          if 'rel="manifest"' not in html:
              html = html.replace('</title>', '</title>\n<link rel="manifest" href="manifest.webmanifest">\n<link rel="icon" type="image/svg+xml" href="icon.svg">\n<link rel="apple-touch-icon" href="icon.svg">', 1)
          html = html.replace('Ninja SLUSHi - App Ricettario Offline v4', 'Ninja SLUSHi Ricettario')
          html = html.replace('Ninja SLUSHi - App Ricettario Offline', 'Ninja SLUSHi Ricettario')

          cat_info = {
              'Regole base e consigli': ('🧭','Guida rapida','Regole pratiche, formule base e trucchi per non fare disastri.','linear-gradient(135deg,#1f2937,#0f172a)'),
              'Granite classiche': ('❄️','Granite classiche','Limone, caffè, menta, cola e i grandi classici da banco bar.','linear-gradient(135deg,#0f766e,#38bdf8)'),
              'Granite alla frutta': ('🍓','Granite alla frutta','Frutta vera, colori forti e sapori freschi senza effetto sciroppone.','linear-gradient(135deg,#be123c,#f59e0b)'),
              'Frozen cocktail': ('🍹','Frozen cocktail','Mojito, Spritz, Margarita, Daiquiri e tutto il reparto festa.','linear-gradient(135deg,#7c2d12,#ea580c)'),
              'Cocktail analcolici': ('🍸','Analcolici','Drink belli da vedere, freschi da bere e senza stendere nessuno.','linear-gradient(135deg,#065f46,#84cc16)'),
              'Frappè': ('☕','Frappè','Caffè, cacao, banana, vaniglia e ricette fredde cremose.','linear-gradient(135deg,#78350f,#d97706)'),
              'Milkshake': ('🥤','Milkshake','Nutella, Oreo, Kinder, pistacchio e roba poco innocente.','linear-gradient(135deg,#3f1d13,#a855f7)'),
              'Caffè e bevande fredde': ('☕','Caffè freddi','Cappuccini ghiacciati, mocha, tè frozen e bevande fredde serie.','linear-gradient(135deg,#422006,#92400e)'),
              'Smoothie ghiacciati': ('🥭','Smoothie','Frutta, yogurt e bevande un filo più leggere, senza fare i santi.','linear-gradient(135deg,#14532d,#22c55e)'),
              'Ricette ignoranti': ('😈','Ricette ignoranti','Nutella, Oreo, Red Bull, Kinder: qui il dietologo cambia mestiere.','linear-gradient(135deg,#111827,#dc2626)'),
              'Amari e digestivi frozen': ('🥃','Amari frozen','Amari, sambuca, brandy e digestivi ghiacciati da fine cena.','linear-gradient(135deg,#3f1d13,#b45309)'),
              'Dessert freddi': ('🍨','Dessert freddi','Sorbetti, tiramisù, creme, cacao e dolci freddi al bicchiere.','linear-gradient(135deg,#581c87,#ec4899)'),
          }

          css = r'''
/* STEP 2 - categorie stile app */
body.app-open{background:#050816;color:#fff;}
body.app-open main{max-width:1180px;}
body.app-open .hero{display:none;}
body.app-open .sticky{background:rgba(3,7,18,.92);border-bottom:1px solid rgba(255,255,255,.10);box-shadow:0 14px 40px rgba(0,0,0,.28);}
body.app-open .tools input,body.app-open .tools button,body.app-open .tools .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;}
body.app-open .tools input::placeholder{color:#94a3b8;}
body.app-open .panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 50px rgba(0,0,0,.28);color:#fff;}
body.app-open .toc-block{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.10);}
body.app-open .toc-links a,body.app-open .alpha a{color:#e5e7eb;}
body.app-open .alpha small,body.app-open #counter{color:#cbd5e1;}
body.app-open #risultati{border:0;color:white;font-size:clamp(2rem,5vw,3.4rem);}
.category{position:relative;margin:34px 0 64px;padding:0;background:transparent;border:0;scroll-margin-top:105px;}
.category-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin:0 0 18px;padding:24px;border-radius:30px;color:#fff;background:var(--section-grad);box-shadow:0 22px 70px rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.14);isolation:isolate;}
.category-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 20%,rgba(255,255,255,.33),transparent 18%),linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.45));z-index:-1;}
.category-emoji{width:76px;height:76px;border-radius:26px;display:grid;place-items:center;font-size:42px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 18px rgba(255,255,255,.08);}
.category-hero h2{border:0!important;margin:0!important;padding:0!important;color:#fff!important;font-size:clamp(2rem,4.5vw,3.4rem);line-height:1;text-transform:uppercase;letter-spacing:.01em;scroll-margin-top:105px;}
.category-kicker{margin:0 0 6px;color:#dbeafe;font-weight:1000;text-transform:uppercase;letter-spacing:.16em;font-size:.82rem;}
.category-desc{margin:.45rem 0 0;color:#e5e7eb;font-weight:800;max-width:720px;}
.category-count{justify-self:end;min-width:96px;text-align:center;border-radius:22px;padding:14px 12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);font-weight:1000;}
.category-count strong{display:block;font-size:2rem;line-height:1;}
.category-count span{display:block;color:#dbeafe;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;}
body.app-open .recipe{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);box-shadow:0 16px 45px rgba(0,0,0,.28);color:#f8fafc;}
body.app-open .recipe:hover{transform:translateY(-2px);transition:.18s ease;box-shadow:0 22px 65px rgba(0,0,0,.38);}
body.app-open .meta,body.app-open .back,body.app-open .dose-label{color:#cbd5e1;}
body.app-open .recipe-actions button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;}
body.app-open .cols section{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px;}
body.app-open .tip{background:rgba(250,204,21,.10);border-left-color:#facc15;color:#fff;}
@media(max-width:720px){.category-hero{grid-template-columns:1fr;gap:12px;padding:20px}.category-emoji{width:64px;height:64px;border-radius:22px;font-size:36px}.category-count{justify-self:start;display:flex;align-items:center;gap:8px}.category-count strong{font-size:1.35rem}.category-hero h2{font-size:2rem}}
'''
          if 'STEP 2 - categorie stile app' not in html:
              html = html.replace('</style>', css + '\n</style>', 1)

          for cat, (emoji, title, desc, grad) in cat_info.items():
              count = len(re.findall(r'<article class="recipe"[^>]*data-category="' + re.escape(cat) + r'"', html))
              pattern = r'(<section class="category" id="([^"]+)" data-category="' + re.escape(cat) + r'">)\s*\n\s*<h2>' + re.escape(cat) + r'</h2>'
              hero = (r'\1' + '\n      <div class="category-hero" style="--section-grad:' + grad + '">\n'
                      '        <div class="category-emoji">' + emoji + '</div>\n'
                      '        <div>\n'
                      '          <p class="category-kicker">Categoria</p>\n'
                      '          <h2>' + cat + '</h2>\n'
                      '          <p class="category-desc">' + desc + '</p>\n'
                      '        </div>\n'
                      '        <div class="category-count"><strong>' + str(count) + '</strong><span>ricette</span></div>\n'
                      '      </div>')
              html = re.sub(pattern, hero, html, count=1)

          Path('.github/workflows/step2-categorie.yml').unlink(missing_ok=True)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/step2-categorie.yml
          git diff --cached --quiet || git commit -m "Style category sections as app cards"
          git push
