name: Remove difficulty quick card item

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-recipe-tech-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove difficulty item
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = ['index.html', 'app-v3.html']
          changed = False

          snippets = [
              '<div class="recipe-tech-item">📌<div><b>Difficoltà</b><span>${info.diff}</span></div></div>',
              '<div class="recipe-tech-item">📌<div><b>Difficoltà</b><span>Facile</span></div></div>',
              '<div class="recipe-tech-item">📌<div><b>Difficolta</b><span>${info.diff}</span></div></div>',
              '<div class="recipe-tech-item">📌<div><b>Difficolta</b><span>Facile</span></div></div>',
          ]

          for name in targets:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              old = s
              for snippet in snippets:
                  s = s.replace(snippet, '')
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed = True

          if not changed:
              raise SystemExit('Nothing changed')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v3.html
          git diff --cached --quiet || git commit -m "Remove difficulty from quick cards"
          git push
# rerun remove difficulty item
