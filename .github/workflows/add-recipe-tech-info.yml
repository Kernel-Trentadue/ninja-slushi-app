name: Add recipe technical info

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-recipe-tech-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add automatic recipe info boxes
        run: |
          python - <<'PY'
          from pathlib import Path

          css = r'''
/* SCHEDA TECNICA RICETTA */
.recipe-tech{margin:14px 0 16px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(168,85,247,.10));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.recipe-tech-title{font-weight:1000;color:#fff;margin:0 0 10px;font-size:1rem;text-transform:uppercase;letter-spacing:.08em}
.recipe-tech-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.recipe-tech-item{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);font-weight:850;color:#e5e7eb;line-height:1.2}
.recipe-tech-item b{display:block;color:#38bdf8;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.recipe-tech-item span{display:block;color:#fff;font-size:.94rem}
@media(max-width:640px){.recipe-tech{padding:12px;border-radius:16px}.recipe-tech-grid{grid-template-columns:1fr}.recipe-tech-item{padding:8px 9px}.recipe-tech-item span{font-size:.9rem}}
/* FINE SCHEDA TECNICA RICETTA */
'''

          js = r'''function recipeTechInfo(cat){let c=(cat||'').toLowerCase();if(c.includes('frozen cocktail'))return {prep:'5/8 min',cool:'Ingredienti già freddi',serv:'2 bicchieri',fn:'Spiked Slush',diff:'Facile'};if(c.includes('cocktail analcolici'))return {prep:'5 min',cool:'Ingredienti già freddi',serv:'2 bicchieri',fn:'Slush / Frozen Drink',diff:'Facile'};if(c.includes('frapp'))return {prep:'5 min',cool:'Latte molto freddo',serv:'2 bicchieri',fn:'Milkshake',diff:'Facile'};if(c.includes('milkshake'))return {prep:'5 min',cool:'Latte molto freddo',serv:'2 bicchieri',fn:'Milkshake',diff:'Facile'};if(c.includes('caff'))return {prep:'5 min',cool:'Caffè già freddo',serv:'2 bicchieri',fn:'Frozen Drink / Slush',diff:'Facile'};if(c.includes('smoothie'))return {prep:'5/7 min',cool:'Frutta fredda o surgelata',serv:'2 bicchieri',fn:'Frozen Drink',diff:'Facile'};if(c.includes('dessert'))return {prep:'8/10 min',cool:'20/30 min se serve',serv:'2 porzioni',fn:'Milkshake / Frozen Drink',diff:'Facile'};if(c.includes('amari'))return {prep:'5 min',cool:'Liquori già freddi',serv:'2 bicchieri piccoli',fn:'Spiked Slush',diff:'Facile'};if(c.includes('ignoranti'))return {prep:'5/8 min',cool:'Ingredienti ben freddi',serv:'2 bicchieri',fn:'Milkshake / Frozen Drink',diff:'Facile'};if(c.includes('granite'))return {prep:'5 min',cool:'30/45 min in frigo',serv:'2/3 bicchieri',fn:'Slush',diff:'Facile'};return {prep:'5 min',cool:'Ingredienti freddi',serv:'2 bicchieri',fn:'Slush',diff:'Facile'}}function insertRecipeTech(card){if(card.querySelector('.recipe-tech'))return;let cat=card.dataset.category||'';let info=recipeTechInfo(cat);let box=document.createElement('div');box.className='recipe-tech';box.innerHTML=`<div class="recipe-tech-title">Scheda rapida</div><div class="recipe-tech-grid"><div class="recipe-tech-item">⏱️<div><b>Preparazione</b><span>${info.prep}</span></div></div><div class="recipe-tech-item">❄️<div><b>Raffreddamento</b><span>${info.cool}</span></div></div><div class="recipe-tech-item">🥤<div><b>Porzioni</b><span>${info.serv}</span></div></div><div class="recipe-tech-item">⚙️<div><b>Funzione consigliata</b><span>${info.fn}</span></div></div><div class="recipe-tech-item">📌<div><b>Difficoltà</b><span>${info.diff}</span></div></div></div>`;let target=card.querySelector('.recipe-photo-wrap')||card.querySelector('.meta')||card.querySelector('h3');if(target)target.insertAdjacentElement('afterend',box);else card.prepend(box)}'''

          for name in ['index.html','app-v3.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              changed=False
              if 'SCHEDA TECNICA RICETTA' not in s and '</style>' in s:
                  s=s.replace('</style>', css+'\n</style>', 1)
                  changed=True
              if 'function recipeTechInfo' not in s:
                  marker='function cleanRecipe(r){'
                  if marker in s:
                      s=s.replace(marker, js+marker, 1)
                      changed=True
              if 'insertRecipeTech(c);wireDose(c);wireFav(c);return c}' not in s:
                  old='wireDose(c);wireFav(c);return c}'
                  if old in s:
                      s=s.replace(old,'insertRecipeTech(c);wireDose(c);wireFav(c);return c}',1)
                      changed=True
              if changed:
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit recipe info boxes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v3.html
          git diff --cached --quiet || git commit -m "Add technical info boxes to recipes"
          git push
