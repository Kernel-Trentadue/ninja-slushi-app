name: Replace duplicate second batch recipes
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/add-recipe-tech-info.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: replace duplicates
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import re
          p=Path('ricette-source.html')
          h=p.read_text(encoding='utf-8')
          remove_ids=['campari-arancia-rossa-frozen','prosecco-pesca-frozen','bounty-frozen','kinder-bueno-frozen']
          for rid in remove_ids:
            h=re.sub(r'\n?<article class="recipe"(?=[^>]*id="'+re.escape(rid)+r'")[\s\S]*?</article>\n?','\n',h)
          data=[
          ('campari-ananas-frozen','Frozen cocktail','Campari Ananas Frozen','images/campari-ananas-frozen.jpg','120 ml Campari|220 ml succo ananas freddo|80 ml soda fredda|35 ml sciroppo di zucchero|10 ml lime','Unisci Campari, ananas, soda, sciroppo e lime.|Mescola piano.|Versa nella macchina.|Avvia Frozen Cocktail.','Ananas addolcisce il Campari senza farlo diventare banale.'),
          ('campari-mango-frozen','Frozen cocktail','Campari Mango Frozen','images/campari-mango-frozen.jpg','120 ml Campari|180 g mango freddo|140 ml acqua fredda|35 ml sciroppo di zucchero|15 ml lime','Frulla mango, acqua, sciroppo e lime.|Aggiungi Campari e mescola.|Versa nella Ninja SLUSHi.|Avvia Frozen Cocktail.','Più tropicale, ma resta amarognolo sul finale.'),
          ('prosecco-kiwi-frozen','Frozen cocktail','Prosecco Kiwi Frozen','images/prosecco-kiwi-frozen.jpg','220 ml Prosecco freddo|2 kiwi maturi freddi|40 ml acqua fredda|30 ml sciroppo di zucchero|10 ml limone','Frulla kiwi, acqua, limone e sciroppo.|Aggiungi Prosecco e mescola piano.|Versa nella macchina.|Avvia Frozen Cocktail.','Acido, verde, fresco: diverso dai soliti prosecco fragola o pesca.'),
          ('cioccolato-arancia-frozen','Milkshake','Cioccolato Arancia Frozen','images/cioccolato-arancia-frozen.jpg','320 ml latte freddo|80 g cioccolato fondente|40 ml panna fredda|25 g zucchero|Scorza arancia|10 ml succo arancia','Sciogli il cioccolato e fallo intiepidire.|Mescola con latte, panna, zucchero, succo e scorza.|Versa nella macchina.|Avvia Milkshake.','Fondente e arancia: più adulto del solito milkshake al cioccolato.')]
          def art(r):
            rid,cat,t,img,ing,steps,tip=r
            ul=''.join('<li data-original="'+escape(x)+'">'+escape(x)+'</li>' for x in ing.split('|'))
            ol=''.join('<li data-original="'+escape(x)+'">'+escape(x)+'</li>' for x in steps.split('|'))
            search=escape((' '.join(r)).lower())
            return f'\n<article class="recipe" data-category="{escape(cat)}" data-image="{escape(img)}" data-name="{escape(t.lower())}" data-search="{search}" id="{escape(rid)}">\n<div class="recipe-top"><span class="badge">{escape(cat)}</span><a class="back" href="#indice">↑ indice</a></div>\n<h3>{escape(t)}</h3>\n<div class="recipe-photo-wrap"><img alt="{escape(t)}" class="recipe-photo" loading="lazy" src="{escape(img)}"/></div>\n<p class="meta">Ricetta · Circa 2 bicchieri</p>\n<div class="recipe-actions"><button class="fav-btn" type="button">♡ Preferito</button><button class="dose-btn" data-scale="0.5" type="button">½ dose</button><button class="dose-btn" data-scale="1" type="button">dose base</button><button class="dose-btn" data-scale="2" type="button">doppia</button><span class="dose-label">Dose ×1</span></div>\n<div class="cols"><section><h4>Ingredienti</h4><ul>{ul}</ul></section><section><h4>Procedura</h4><ol>{ol}</ol></section></div>\n<p class="tip"><b>Consiglio:</b> {escape(tip)}</p>\n</article>\n'
          block='\n<!-- SOSTITUZIONI BLOCCO 2 -->\n'
          for r in data:
            if 'id="'+r[0]+'"' not in h:
              block+=art(r)
          h=h.replace('</main>',block+'\n</main>',1) if '</main>' in h else h+block
          p.write_text(h,encoding='utf-8')
          PY
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ricette-source.html
          git diff --cached --quiet || git commit -m "Replace duplicate second batch recipes"
          git push
# rerun replace duplicate recipes
