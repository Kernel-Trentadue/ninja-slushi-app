name: Skip quick cards for guide recipes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-recipe-tech-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip quick cards for Regole base e consigli
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = ['index.html', 'app-v3.html']

          old = "function insertRecipeTech(card){if(card.querySelector('.recipe-tech'))return;let cat=card.dataset.category||'';"
          new = "function insertRecipeTech(card){if(card.querySelector('.recipe-tech'))return;let cat=card.dataset.category||'';if((cat||'').toLowerCase().includes('regole base'))return;"

          changed_any = False
          for name in targets:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              before = s
              if old in s:
                  s = s.replace(old, new, 1)
              # fallback: remove any already-generated quick card inside guide articles if present in static html
              import re
              s = re.sub(r'(<article[^>]+data-category="Regole base e consigli"[^>]*>)(.*?)(<div class="recipe-tech">.*?</div>\s*)(.*?</article>)', lambda m: m.group(1)+m.group(2)+m.group(4), s, flags=re.S)
              if s != before:
                  p.write_text(s, encoding='utf-8')
                  changed_any = True

          if not changed_any:
              raise SystemExit('No changes made: target pattern not found')
          PY
      - name: Commit skip guide cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v3.html
          git diff --cached --quiet || git commit -m "Skip quick card for guide recipes"
          git push
# rerun skip guide cards
