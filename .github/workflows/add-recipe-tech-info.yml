name: Change dose buttons to min base max
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/add-recipe-tech-info.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dose controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          start=h.index('function wireRecipe(card){')
          end=h.index('function recipeTechInfo', start)
          new=r'''function estimateRecipeMl(card){
 let total=0;
 const includeG=/fragol|pesca|mango|melone|anguria|ananas|kiwi|banana|lampone|cilieg|albicocc|pera|mela|frutti|bosco|polpa|yogurt|gelato|ricotta|mascarpone|formaggio|nutella|cioccolato|panna cotta|crema|latte condensato|miele/i;
 const excludeG=/zucchero|cacao|biscott|oreo|pan di stelle|noci|mandorle|nocciole|pistacchi|menta|scorza|vaniglia|cannella/i;
 $$('li',card).forEach(li=>{
   const t=li.getAttribute('data-original')||li.textContent||'';
   t.replace(/(\d+(?:[,.]\d+)?)\s*ml\b/gi,(m,n)=>{total+=parseFloat(n.replace(',','.'))||0});
   t.replace(/(\d+(?:[,.]\d+)?)\s*l\b/gi,(m,n)=>{total+=(parseFloat(n.replace(',','.'))||0)*1000});
   if(includeG.test(t) && !excludeG.test(t)) t.replace(/(\d+(?:[,.]\d+)?)\s*g\b/gi,(m,n)=>{total+=parseFloat(n.replace(',','.'))||0});
   t.replace(/(\d+(?:[,.]\d+)?)\s*kg\b/gi,(m,n)=>{total+=(parseFloat(n.replace(',','.'))||0)*1000});
 });
 return Math.max(total,0);
}
function niceScaleLabel(scale,mode){
 if(mode==='min')return 'Dose minima';
 if(mode==='max')return 'Dose massima';
 return 'Dose base';
}
function wireRecipe(card){
 const favBtn=card.querySelector('.fav-btn'), doseBtns=$$('.dose-btn',card), doseLabel=card.querySelector('.dose-label'), key='slushi_fav_'+card.id;
 decorateBadge(card);
 if(favBtn){const on=safeGet(key)==='1';card.classList.toggle('isFav',on);favBtn.classList.toggle('fav-on',on);favBtn.textContent=on?'❤️ Preferito':'♡ Preferito';favBtn.onclick=function(){const now=!card.classList.contains('isFav');card.classList.toggle('isFav',now);favBtn.classList.toggle('fav-on',now);favBtn.textContent=now?'❤️ Preferito':'♡ Preferito';safeSet(key,now?'1':'0');updateFavButton()}}
 if(doseBtns.length){
   const baseMl=estimateRecipeMl(card)||700;
   const modes=['min','base','max'];
   const labels=['Dose minima','Dose base','Dose massima'];
   doseBtns.forEach((btn,i)=>{btn.textContent=labels[i]||labels[1];btn.setAttribute('data-mode',modes[i]||'base');btn.removeAttribute('data-scale')});
   function applyDose(mode,btn){
     let scale=1;
     if(mode==='min') scale=475/baseMl;
     if(mode==='max') scale=1890/baseMl;
     if(mode==='base') scale=1;
     $$('li',card).forEach(li=>{const original=li.getAttribute('data-original')||li.textContent;li.textContent=scaleText(original,scale)});
     doseBtns.forEach(b=>b.classList.remove('active'));
     if(btn)btn.classList.add('active');
     if(doseLabel){
       const ml=Math.round(baseMl*scale);
       doseLabel.textContent=niceScaleLabel(scale,mode)+' · circa '+ml+' ml';
     }
   }
   doseBtns.forEach(btn=>{btn.onclick=function(){applyDose(btn.getAttribute('data-mode')||'base',btn)}});
   const baseBtn=doseBtns.find(b=>(b.getAttribute('data-mode')==='base'))||doseBtns[1]||doseBtns[0];
   applyDose('base',baseBtn);
 }
}
'''
          h=h[:start]+new+h[end:]
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit dose controls
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Change dose buttons to min base max"
          git push
# trigger dose controls min base max
