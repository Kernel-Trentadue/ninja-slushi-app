name: Remove portions from recipe quick cards

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-recipe-tech-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove porzioni item from quick cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ['index.html','app-v3.html']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              old = s

              # Rimuove il blocco Porzioni dalla scheda rapida generata via JS
              s = re.sub(
                  r'<div class="recipe-tech-item">🥤<div><b>Porzioni</b><span>\$\{info\.serv\}</span></div></div>',
                  '',
                  s
              )
              s = re.sub(
                  r'<div class="recipe-tech-item">🥤<div><b>Porzioni</b><span>\$\{info\.serv\}</span></div></div>',
                  '',
                  s
              )
              s = re.sub(
                  r'<div class="recipe-tech-item">🥤<div><b>Porzioni</b><span>[^<]*</span></div></div>',
                  '',
                  s
              )

              # Opzionale: la variabile serv resta nel calcolo ma non viene più mostrata.
              # Mantenerla non rompe niente e evita patch rischiose sul JS minificato.

              if s != old:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit without portions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v3.html
          git diff --cached --quiet || git commit -m "Remove portions from recipe quick cards"
          git push
# rerun remove portions
