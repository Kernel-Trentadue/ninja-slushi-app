name: Add crema di caffe recipe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/add-recipe-tech-info.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add crema di caffe del bar
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import re

          p = Path('ricette-source.html')
          h = p.read_text(encoding='utf-8')
          rid = 'crema-di-caffe-del-bar'
          if f'id="{rid}"' not in h:
              cat = 'Caffè e bevande fredde'
              title = 'Crema di caffè del bar'
              img = 'images/crema-di-caffe-del-bar.jpg'
              ingredients = [
                  '300 ml caffè espresso freddo',
                  '300 ml latte intero freddo',
                  '200 ml panna fresca liquida fredda',
                  '100 g zucchero',
                  '20 g latte condensato facoltativo',
                  'Cacao amaro per servire'
              ]
              steps = [
                  'Prepara il caffè e fallo raffreddare completamente.',
                  'Mescola caffè, latte, panna e zucchero fuori dalla macchina.',
                  'Sciogli benissimo lo zucchero: non devono restare granelli.',
                  'Metti il composto in frigo almeno 1 ora, meglio se molto freddo.',
                  'Versa nella Ninja SLUSHi, senza ghiaccio.',
                  'Avvia Milkshake oppure Frozen Drink, poi servi subito con cacao sopra.'
              ]
              tip = 'Dose da circa 800 ml: perfetta per la macchina. Il latte condensato la rende più cremosa e più simile a quella del bar.'
              ing_html = ''.join(f'<li data-original="{escape(x)}">{escape(x)}</li>' for x in ingredients)
              step_html = ''.join(f'<li data-original="{escape(x)}">{escape(x)}</li>' for x in steps)
              search = escape((cat+' '+title+' crema caffe caffè bar milkshake panna latte condensato').lower())
              art = f'''
<article class="recipe" data-category="{escape(cat)}" data-image="{escape(img)}" data-name="{escape(title.lower())}" data-search="{search}" id="{rid}">
<div class="recipe-top"><span class="badge">{escape(cat)}</span><a class="back" href="#indice">↑ indice</a></div>
<h3>{escape(title)}</h3>
<div class="recipe-photo-wrap"><img alt="{escape(title)}" class="recipe-photo" loading="lazy" src="{escape(img)}"/></div>
<p class="meta">Ricetta classica · Circa 800 ml</p>
<div class="recipe-actions"><button class="fav-btn" type="button">♡ Preferito</button><button class="dose-btn" data-scale="0.5" type="button">Dose minima</button><button class="dose-btn" data-scale="1" type="button">Dose base</button><button class="dose-btn" data-scale="2" type="button">Dose massima</button><span class="dose-label">Dose base</span></div>
<div class="cols"><section><h4>Ingredienti</h4><ul>{ing_html}</ul></section><section><h4>Procedura</h4><ol>{step_html}</ol></section></div>
<p class="tip"><b>Consiglio:</b> {escape(tip)}</p>
</article>
'''
              marker='</main>'
              if marker in h:
                  h = h.replace(marker, '\n<!-- RICETTA AGGIUNTA: CREMA DI CAFFE -->\n'+art+'\n'+marker, 1)
              else:
                  h += '\n'+art
              # update counter text if present
              h = re.sub(r'Mostro\s+(\d+)\s+ricette/schede', lambda m: 'Mostro '+str(int(m.group(1))+1)+' ricette/schede', h, count=1)
              p.write_text(h, encoding='utf-8')
          PY
      - name: Commit recipe
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ricette-source.html
          git diff --cached --quiet || git commit -m "Add crema di caffe del bar recipe"
          git push
# trigger add crema caffe
