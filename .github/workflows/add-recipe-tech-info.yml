name: Improve recipe technical info

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-recipe-tech-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace generic estimates with recipe-aware estimates
        run: |
          python - <<'PY'
          from pathlib import Path

          new_js = r'''function recipeTechInfo(card){
  let cat=(card.dataset.category||'').toLowerCase();
  let name=((card.querySelector('h3')||{}).textContent||card.id||'').toLowerCase();
  let t=name+' '+cat;
  const has=(...w)=>w.some(x=>t.includes(x));
  let prep='5 min', machine='25–35 min', serv='2 bicchieri', fn='Slush', texture='Slush morbida';

  if(cat.includes('granite')){
    fn='Slush'; serv='2/3 bicchieri'; texture='Granita fine e cucchiaiabile'; prep='5 min';
    if(has('caffè','caffe','mandorla','orzata','cocco','banana','cacao','mango','pera','pesca','fichi','fico','ananas')) machine='35–45 min';
    else if(has('anguria','melone','pompelmo','arancia','limone','menta','cola','gassosa','cedrata','chinotto','tamarindo')) machine='22–32 min';
    else if(has('fragola','frutti','bosco','lampone','ciliegia','melagrana','uva','kiwi','passion')) machine='30–40 min';
    else machine='25–38 min';
  }

  if(cat.includes('frozen cocktail')){
    fn='Spiked Slush'; serv='2 bicchieri'; texture='Frozen da bere con cannuccia'; prep='5/8 min';
    if(has('spritz','bellini','rossini','hugo','campari','americano','limoncello')) machine='25–35 min';
    else if(has('mojito','daiquiri','paloma','moscow','vodka lemon','gin lemon','caipiroska')) machine='30–42 min';
    else if(has('margarita','negroni','espresso','pornstar','sex on the beach','cuba libre','mai tai','rum punch','long island','sangria','pina colada')) machine='35–50 min';
    else machine='30–45 min';
  }

  if(cat.includes('cocktail analcolici')){
    fn='Slush / Frozen Drink'; serv='2 bicchieri'; texture='Frozen leggero'; prep='5 min';
    if(has('ananas','cocco','tropical','mela','pesca','cranberry')) machine='30–40 min';
    else if(has('limonata','menta','lime','cetriolo','ginger','arancia','spritz','mojito')) machine='22–34 min';
    else machine='25–38 min';
  }

  if(cat.includes('frapp')){
    fn='Milkshake'; serv='2 bicchieri'; texture='Cremoso ma non troppo denso'; prep='5/7 min';
    if(has('nutella','nocciola','caramello','stracciatella','cocco','ananas','yogurt','miele')) machine='30–42 min';
    else if(has('caffè','caffe','vaniglia','fragola','banana','mango','cioccolato')) machine='25–35 min';
    else machine='28–40 min';
  }

  if(cat.includes('milkshake')){
    fn='Milkshake'; serv='2 bicchieri'; texture='Denso e cremoso'; prep='5/8 min';
    if(has('nutella','oreo','kinder','pistacchio','tiramisù','tiramisu','snickers','mars','raffaello','ferrero','burro','arachidi','mou','bounty','cioccolato')) machine='35–50 min';
    else if(has('vaniglia','fragola','banana')) machine='25–38 min';
    else machine='30–45 min';
  }

  if(cat.includes('caff')){
    fn='Frozen Drink / Slush'; serv='2 bicchieri'; texture='Freddo cremoso'; prep='5 min';
    if(has('mocha','caramel','nocciola','affogato')) machine='30–45 min';
    else if(has('tè','te','tonic','cold brew')) machine='20–32 min';
    else machine='25–38 min';
  }

  if(cat.includes('smoothie')){
    fn='Frozen Drink'; serv='2 bicchieri'; texture='Smoothie freddo e vellutato'; prep='5/7 min';
    if(has('banana','mango','avocado','yogurt','proteico','burro')) machine='35–48 min';
    else if(has('anguria','melone','ananas','mela','kiwi','pesca')) machine='28–40 min';
    else machine='30–45 min';
  }

  if(cat.includes('amari')){
    fn='Spiked Slush'; serv='2 bicchieri piccoli'; texture='Digestivo frozen'; prep='5 min'; machine=has('crema','caffè','caffe')?'35–50 min':'30–45 min';
  }

  if(cat.includes('dessert')){
    fn='Milkshake / Frozen Drink'; serv='2 porzioni'; texture='Dessert freddo cremoso'; prep='8/10 min';
    if(has('tiramisù','tiramisu','nutella','oreo','pistacchio','cioccolato','mascarpone','crema')) machine='38–55 min';
    else machine='32–48 min';
  }

  if(cat.includes('ignoranti')){
    fn='Milkshake / Frozen Drink'; serv='2 bicchieri'; texture='Molto densa e golosa'; prep='6/10 min'; machine='38–55 min';
  }

  return {prep,machine,serv,fn,texture};
}
function insertRecipeTech(card){
  if(card.querySelector('.recipe-tech'))return;
  let info=recipeTechInfo(card);
  let box=document.createElement('div');
  box.className='recipe-tech';
  box.innerHTML=`<div class="recipe-tech-title">Scheda rapida stimata</div><div class="recipe-tech-grid"><div class="recipe-tech-item">⏱️<div><b>Preparazione</b><span>${info.prep}</span></div></div><div class="recipe-tech-item">🧊<div><b>Tempo in macchina</b><span>${info.machine}</span></div></div><div class="recipe-tech-item">🥤<div><b>Porzioni</b><span>${info.serv}</span></div></div><div class="recipe-tech-item">⚙️<div><b>Funzione consigliata</b><span>${info.fn}</span></div></div><div class="recipe-tech-item">📌<div><b>Consistenza</b><span>${info.texture}</span></div></div></div>`;
  let target=card.querySelector('.recipe-photo-wrap')||card.querySelector('.meta')||card.querySelector('h3');
  if(target)target.insertAdjacentElement('afterend',box);else card.prepend(box);
}'''

          def replace_between(s, start_marker, end_marker, replacement):
              a=s.find(start_marker)
              if a<0:
                  return s, False
              b=s.find(end_marker,a)
              if b<0:
                  return s, False
              return s[:a]+replacement+s[b:], True

          for name in ['index.html','app-v3.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              changed=False
              s=s.replace('SCHEDA TECNICA RICETTA','SCHEDA TECNICA RICETTA')
              s, ok = replace_between(s, 'function recipeTechInfo', 'function cleanRecipe', new_js+'function cleanRecipe')
              changed = changed or ok
              s=s.replace('insertRecipeTech(c);wireDose(c);wireFav(c);return c}', 'insertRecipeTech(c);wireDose(c);wireFav(c);return c}')
              s=s.replace('insertRecipeTech(c);wireRecipe(c);return c}', 'insertRecipeTech(c);wireRecipe(c);return c}')
              s=s.replace('Raffreddamento', 'Tempo in macchina')
              s=s.replace('Difficoltà', 'Consistenza')
              if changed:
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit smarter machine time estimates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v3.html
          git diff --cached --quiet || git commit -m "Make recipe quick cards estimate machine time per recipe"
          git push
